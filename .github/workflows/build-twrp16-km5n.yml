name: Build TWRP KM5n (16.0 / Android 15)

on:
  workflow_dispatch:
    inputs:
      build_jobs:
        description: "Ninja jobs (1 recommended on the standard runner)"
        required: true
        default: "1"
        type: choice
        options: ["1", "2"]

permissions:
  contents: read

concurrency:
  group: km5n-twrp16-build
  cancel-in-progress: false

env:
  TWRP_MANIFEST_URL: https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git
  TWRP_MANIFEST_BRANCH: twrp-16.0
  DEVICE_PATH: device/tecno/km5n
  LUNCH_TARGET: twrp_km5n-bp2a-eng
  BUILD_TARGET: vendorbootimage

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    env:
      TWRP_DIR: ${{ github.workspace }}/twrp16
    steps:
      - name: Expand build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 128
          swap-size-mb: 12288
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-codeql: 'true'
          remove-haskell: 'true'
          remove-docker-images: 'true'

      - name: Checkout device tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1

      - name: Audit KM5n tree
        run: |
          set -euxo pipefail
          chmod +x "$DEVICE_PATH/scripts/audit_twrp16_compatibility.sh"
          "$DEVICE_PATH/scripts/audit_twrp16_compatibility.sh" "$DEVICE_PATH"

      - name: Verify runner capacity
        run: |
          set -euxo pipefail
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/powershell /opt/ghc 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/* /tmp/* /var/tmp/* 2>/dev/null || true
          df -h "$GITHUB_WORKSPACE"
          free -h
          avail=$(df --output=avail "$GITHUB_WORKSPACE" | tail -1 | tr -d ' ')
          test "$avail" -ge 90000000

      - name: Install dependencies and repo
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get install -y --no-install-recommends openjdk-17-jdk-headless bc bison build-essential curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses6 lib32z1 libelf-dev liblz4-tool libncurses-dev libssl-dev libxml2-utils lzop pngcrush python3 python3-pip python3-setuptools rsync unzip xsltproc zip zlib1g-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 3 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod 0755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize and sync TWRP 16.0
        run: |
          set -euxo pipefail
          rm -rf "$TWRP_DIR"
          mkdir -p "$TWRP_DIR"
          cd "$TWRP_DIR"
          repo init --depth=1 -u "$TWRP_MANIFEST_URL" -b "$TWRP_MANIFEST_BRANCH"
          rc=1
          for attempt in 1 2 3; do
            repo sync -c -j1 --force-sync --no-clone-bundle --no-tags --optimized-fetch --retry-fetches=5 --prune && { rc=0; break; } || rc=$?
            sleep 10
          done
          exit "$rc"

      - name: Install authoritative KM5n tree
        run: |
          set -euxo pipefail
          cd "$TWRP_DIR"
          rm -rf "$DEVICE_PATH"
          mkdir -p "$(dirname "$DEVICE_PATH")"
          rsync -a --delete --exclude='.git' "$GITHUB_WORKSPACE/$DEVICE_PATH/" "$DEVICE_PATH/"
          chmod +x "$DEVICE_PATH/scripts/audit_twrp16_compatibility.sh"
          "$DEVICE_PATH/scripts/audit_twrp16_compatibility.sh" "$DEVICE_PATH"

      - name: Lunch and record resolved configuration
        run: |
          set -eo pipefail
          cd "$TWRP_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export TARGET_RELEASE=bp2a
          export LC_ALL=C
          export TMPDIR="$TWRP_DIR/tmp"
          mkdir -p "$TMPDIR"
          source build/envsetup.sh
          lunch "$LUNCH_TARGET" > "$GITHUB_WORKSPACE/lunch.log" 2>&1
          cat "$GITHUB_WORKSPACE/lunch.log"
          {
            echo "TARGET_PRODUCT=$(get_build_var TARGET_PRODUCT)"
            echo "TARGET_DEVICE=$(get_build_var TARGET_DEVICE)"
            echo "TARGET_BUILD_VARIANT=$(get_build_var TARGET_BUILD_VARIANT)"
            echo "PLATFORM_VERSION=$(get_build_var PLATFORM_VERSION)"
            echo "PRODUCT_SHIPPING_API_LEVEL=$(get_build_var PRODUCT_SHIPPING_API_LEVEL)"
            echo "BOARD_SYSTEMSDK_VERSIONS=$(get_build_var BOARD_SYSTEMSDK_VERSIONS)"
            echo "BOARD_BOOT_HEADER_VERSION=$(get_build_var BOARD_BOOT_HEADER_VERSION)"
            echo "BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE=$(get_build_var BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE)"
            echo "BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT=$(get_build_var BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT)"
            echo "BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT=$(get_build_var BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT)"
            echo "TARGET_NO_RECOVERY=$(get_build_var TARGET_NO_RECOVERY)"
          } | tee "$GITHUB_WORKSPACE/build-vars.log"
          test "$(get_build_var TARGET_PRODUCT)" = twrp_km5n
          test "$(get_build_var TARGET_DEVICE)" = km5n
          test "$(get_build_var TARGET_BUILD_VARIANT)" = eng
          test "$(get_build_var PRODUCT_SHIPPING_API_LEVEL)" = 35
          test "$(get_build_var BOARD_BOOT_HEADER_VERSION)" = 4
          test "$(get_build_var BOARD_VENDOR_BOOTIMAGE_PARTITION_SIZE)" = 67108864
          test "$(get_build_var BOARD_MOVE_RECOVERY_RESOURCES_TO_VENDOR_BOOT)" = true
          test "$(get_build_var BOARD_INCLUDE_RECOVERY_RAMDISK_IN_VENDOR_BOOT)" = true
          test "$(get_build_var TARGET_NO_RECOVERY)" = true
          sdk=$(get_build_var BOARD_SYSTEMSDK_VERSIONS)
          for v in $(printf '%s\n' "$sdk" | grep -oE '[0-9]+' || true); do test "$v" -ge 35 || exit 1; done

          mkdir -p "$GITHUB_WORKSPACE/checkpoint"
          cp "$GITHUB_WORKSPACE/lunch.log" "$GITHUB_WORKSPACE/checkpoint/"
          cp "$GITHUB_WORKSPACE/build-vars.log" "$GITHUB_WORKSPACE/checkpoint/"
          echo "READY=true" > "$GITHUB_WORKSPACE/checkpoint/status.txt"

      - name: Cache prepared TWRP source and build state
        uses: actions/cache/save@v4
        with:
          path: |
            twrp16/out
            twrp16/.repo/project.list
          key: km5n-twrp16-prepared-${{ github.run_id }}

      - name: Upload preparation metadata
        uses: actions/upload-artifact@v4
        with:
          name: km5n-twrp16-preparation-${{ github.run_id }}
          path: checkpoint/
          retention-days: 3

      - id: ready
        run: echo "ready=true" >> "$GITHUB_OUTPUT"

  slice:
    needs: prepare
    if: needs.prepare.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        slice: [1, 2, 3, 4, 5, 6]
    env:
      TWRP_DIR: ${{ github.workspace }}/twrp16
      BUILD_JOBS: ${{ inputs.build_jobs || '1' }}
    steps:
      - name: Expand build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 128
          swap-size-mb: 12288
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-codeql: 'true'
          remove-haskell: 'true'
          remove-docker-images: 'true'

      - name: Checkout device tree
        uses: actions/checkout@v7
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1

      - name: Install dependencies and repo
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get install -y --no-install-recommends openjdk-17-jdk-headless bc bison build-essential curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses6 lib32z1 libelf-dev liblz4-tool libncurses-dev libssl-dev libxml2-utils lzop pngcrush python3 python3-pip python3-setuptools rsync unzip xsltproc zip zlib1g-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          mkdir -p "$HOME/bin"
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 3 https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod 0755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Initialize and sync TWRP source
        run: |
          set -euxo pipefail
          rm -rf "$TWRP_DIR"
          mkdir -p "$TWRP_DIR"
          cd "$TWRP_DIR"
          repo init --depth=1 -u "$TWRP_MANIFEST_URL" -b "$TWRP_MANIFEST_BRANCH"
          repo sync -c -j1 --force-sync --no-clone-bundle --no-tags --optimized-fetch --retry-fetches=5 --prune

      - name: Install KM5n tree
        run: |
          set -euxo pipefail
          cd "$TWRP_DIR"
          rm -rf "$DEVICE_PATH"
          mkdir -p "$(dirname "$DEVICE_PATH")"
          rsync -a --delete --exclude='.git' "$GITHUB_WORKSPACE/$DEVICE_PATH/" "$DEVICE_PATH/"
          chmod +x "$DEVICE_PATH/scripts/audit_twrp16_compatibility.sh"
          "$DEVICE_PATH/scripts/audit_twrp16_compatibility.sh" "$DEVICE_PATH"

      - name: Restore incremental build output
        uses: actions/cache/restore@v4
        with:
          path: twrp16/out
          key: km5n-twrp16-prepared-${{ github.run_id }}

      - name: Re-save checkpoint under slice key
        if: matrix.slice > 1
        uses: actions/cache/restore@v4
        with:
          path: twrp16/out
          key: km5n-twrp16-slice-${{ github.run_id }}-${{ matrix.slice - 1 }}

      - name: Build slice
        id: build
        run: |
          set -eo pipefail
          cd "$TWRP_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export TARGET_RELEASE=bp2a
          export LC_ALL=C
          export TMPDIR="$TWRP_DIR/tmp"
          mkdir -p "$TMPDIR" "$GITHUB_WORKSPACE/checkpoint"
          source build/envsetup.sh
          lunch "$LUNCH_TARGET" >/dev/null 2>&1
          LOG="$GITHUB_WORKSPACE/checkpoint/slice-${{ matrix.slice }}.log"
          MON="$GITHUB_WORKSPACE/checkpoint/resource-${{ matrix.slice }}.log"
          : > "$LOG"; : > "$MON"
          (
            while :; do
              echo "=== $(date -u) ===" >> "$MON"
              free -h >> "$MON" 2>&1
              df -h "$GITHUB_WORKSPACE" >> "$MON" 2>&1
              ps -eo pid,ppid,%mem,%cpu,rss,vsz,stat,comm --sort=-rss | head -25 >> "$MON" 2>&1
              sleep 15
            done
          ) & MONITOR_PID=$!
          set +e
          timeout --signal=TERM --kill-after=60s 50m mka "$BUILD_TARGET" -j"$BUILD_JOBS" 2>&1 | tee -a "$LOG"
          rc=${PIPESTATUS[0]}
          set -e
          kill "$MONITOR_PID" 2>/dev/null || true
          wait "$MONITOR_PID" 2>/dev/null || true
          echo "mka exit code: $rc" | tee -a "$LOG"
          if [ -s "$TWRP_DIR/out/target/product/km5n/vendor_boot.img" ]; then
            echo "BUILD_COMPLETE=true" > "$GITHUB_WORKSPACE/checkpoint/status.txt"
            echo "complete=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$rc" -eq 124 ]; then
            echo "BUILD_COMPLETE=false" > "$GITHUB_WORKSPACE/checkpoint/status.txt"
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit "$rc"

      - name: Save incremental checkpoint
        if: steps.build.outputs.complete != 'true'
        uses: actions/cache/save@v4
        with:
          path: twrp16/out
          key: km5n-twrp16-slice-${{ github.run_id }}-${{ matrix.slice }}

      - name: Upload slice diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: km5n-twrp16-slice-${{ matrix.slice }}-${{ github.run_id }}
          path: checkpoint/
          if-no-files-found: warn
          retention-days: 3

      - name: Validate completed image
        if: steps.build.outputs.complete == 'true'
        run: |
          set -euxo pipefail
          IMG="$TWRP_DIR/out/target/product/km5n/vendor_boot.img"
          bash "$TWRP_DIR/$DEVICE_PATH/scripts/validate_vendor_boot.sh" "$IMG"
          python3 - "$IMG" <<'PY'
          import struct,sys
          d=open(sys.argv[1],'rb').read()
          assert d[:8] == b'VNDRBOOT'
          version,page=struct.unpack_from('<II',d,8)
          assert version == 4
          assert page == 4096
          assert len(d) <= 67108864
          print('PASS: vendor_boot v4 structure and size checks')
          PY

      - name: Upload completed vendor_boot
        if: steps.build.outputs.complete == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: km5n-twrp16-vendor-boot-${{ github.run_id }}
          path: twrp16/out/target/product/km5n/vendor_boot.img
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
