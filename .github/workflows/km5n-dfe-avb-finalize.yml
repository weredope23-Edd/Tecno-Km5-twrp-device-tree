name: KM5n DFE AVB Finalizer

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'KM5n Vendor DFE Inspector run ID'
        required: true
        type: string
  workflow_run:
    workflows: ['KM5n Vendor DFE Inspector']
    types: [completed]

jobs:
  finalize:
    name: Finalize and validate AVB-correct vendor DFE image
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Select source run
        id: source
        env:
          MANUAL_RUN_ID: ${{ inputs.source_run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          run_id="${MANUAL_RUN_ID:-$EVENT_RUN_ID}"
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Using source run $run_id"

      - name: Download candidate artifact from source run
        uses: actions/download-artifact@v4
        with:
          name: km5n-vendor-dfe-candidate
          path: candidate_artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.run_id }}

      - name: Verify candidate artifact
        run: |
          set -euo pipefail
          test -f candidate_artifact/vendor_a_dfe_candidate.img
          test -f candidate_artifact/vendor_a_avb.txt
          test -f candidate_artifact/vendor_a_dfe_candidate.sha256
          cp candidate_artifact/vendor_a_dfe_candidate.img vendor_a_dfe_candidate.img
          cp candidate_artifact/vendor_a_avb.txt vendor_a_avb.txt
          cp candidate_artifact/vendor_a_dfe_candidate.sha256 vendor_a_dfe_candidate.sha256
          echo 'Artifact archive integrity was verified by actions/download-artifact.'
          echo 'Candidate files:'
          ls -lh vendor_a_dfe_candidate.img vendor_a_avb.txt vendor_a_dfe_candidate.sha256

      - name: Install Android 15 AVB tooling
        run: |
          set -euo pipefail
          git clone --depth 1 --branch android-15.0.0_r35 https://android.googlesource.com/platform/external/avb /tmp/avb
          python3 /tmp/avb/avbtool.py version | tee avbtool_version.txt

      - name: Capture stock AVB parameters
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('vendor_a_avb.txt').read_text()
          def one(p,name):
              m=re.search(p,s,re.M)
              if not m: raise SystemExit(f'missing AVB field: {name}')
              return m.group(1)
          values={
              'salt':one(r'^\s*Salt:\s+([0-9a-fA-F]+)$','Salt'),
              'hash_algorithm':one(r'^\s*Hash Algorithm:\s+(\S+)$','Hash Algorithm'),
              'partition_name':one(r'^\s*Partition Name:\s+(\S+)$','Partition Name'),
              'fec_roots':one(r'^\s*FEC num roots:\s+(\d+)$','FEC num roots'),
              'algorithm':one(r'^\s*Algorithm:\s+(\S+)$','Algorithm'),
              'rollback_index':one(r'^\s*Rollback Index:\s+(\d+)$','Rollback Index'),
              'rollback_index_location':one(r'^\s*Rollback Index Location:\s+(\d+)$','Rollback Index Location'),
              'flags':one(r'^\s*Flags:\s+(\d+)$','Flags'),
              'release':one(r"^\s*Release String:\s+'(.*)'$",'Release String'),
              'image_size':one(r'^\s*Image size:\s+(\d+) bytes$','Image size'),
          }
          props=re.findall(r"^\s*Prop: ([^ ]+) -> '(.*)'$",s,re.M)
          expected={
              'com.android.build.vendor.os_version':'15',
              'com.android.build.vendor.security_patch':'2026-05-01',
              'com.android.build.vendor.fingerprint':'TECNO/KM5n-OP/TECNO-KM5n:15/AP3A.240905.015.A2/260422V952:user/release-keys',
          }
          got=dict(props)
          for k,v in expected.items():
              if got.get(k) != v: raise SystemExit(f'unexpected stock AVB property {k}: {got.get(k)!r}')
          Path('avb_params.env').write_text('\n'.join([
              f"AVB_SALT={values['salt']}",
              f"AVB_HASH_ALGORITHM={values['hash_algorithm']}",
              f"AVB_PARTITION_NAME={values['partition_name']}",
              f"AVB_FEC_ROOTS={values['fec_roots']}",
              f"AVB_ALGORITHM={values['algorithm']}",
              f"AVB_ROLLBACK_INDEX={values['rollback_index']}",
              f"AVB_ROLLBACK_INDEX_LOCATION={values['rollback_index_location']}",
              f"AVB_FLAGS={values['flags']}",
              f"AVB_STOCK_IMAGE_SIZE={values['image_size']}",
              'AVB_RELEASE='+repr(values['release']),
          ]+[f'AVB_PROP_{i}='+repr(k+':'+v) for i,(k,v) in enumerate(props)])+'\n')
          print(Path('avb_params.env').read_text(),end='')
          if values['partition_name'] != 'vendor': raise SystemExit('unexpected partition name')
          if values['hash_algorithm'] != 'sha256': raise SystemExit('unexpected hash algorithm')
          if values['algorithm'] != 'NONE': raise SystemExit('unexpected AVB signing algorithm')
          if values['fec_roots'] != '2': raise SystemExit('unexpected FEC roots')
          if values['image_size'] != '512012288': raise SystemExit('unexpected stock AVB image size')

      - name: Calculate AVB capacity and prepare data area
        run: |
          set -euo pipefail
          source avb_params.env
          partition_size=521871360
          max_image_size="$(python3 /tmp/avb/avbtool.py add_hashtree_footer --partition_size "$partition_size" --hash_algorithm "$AVB_HASH_ALGORITHM" --block_size 4096 --fec_num_roots "$AVB_FEC_ROOTS" --calc_max_image_size)"
          echo "AVB calculated maximum image size: $max_image_size"
          candidate_size="$(stat -c '%s' vendor_a_dfe_candidate.img)"
          echo "Raw candidate size: $candidate_size"
          echo "Required stock data-area size: $AVB_STOCK_IMAGE_SIZE"
          if [ "$candidate_size" -gt "$AVB_STOCK_IMAGE_SIZE" ]; then
            echo 'Candidate is larger than the stock AVB data area.'
            exit 1
          fi
          if [ "$AVB_STOCK_IMAGE_SIZE" -gt "$max_image_size" ]; then
            echo 'Stock data-area size does not fit this AVB partition geometry.'
            exit 1
          fi
          cp vendor_a_dfe_candidate.img vendor_a_dfe.img
          if [ "$candidate_size" -lt "$AVB_STOCK_IMAGE_SIZE" ]; then
            truncate -s "$AVB_STOCK_IMAGE_SIZE" vendor_a_dfe.img
          fi
          stat -c 'Prepared image size: %s bytes' vendor_a_dfe.img

      - name: Add AVB hashtree, FEC and footer
        run: |
          set -euo pipefail
          source avb_params.env
          partition_size=521871360
          props=()
          while IFS= read -r line; do
            [[ "$line" == AVB_PROP_* ]] || continue
            val="${line#*=}"
            val="${val#\'}"; val="${val%\'}"
            props+=(--prop "$val")
          done < avb_params.env
          args=(add_hashtree_footer
                --image vendor_a_dfe.img
                --partition_size "$partition_size"
                --partition_name "$AVB_PARTITION_NAME"
                --hash_algorithm "$AVB_HASH_ALGORITHM"
                --block_size 4096
                --salt "$AVB_SALT"
                --algorithm "$AVB_ALGORITHM"
                --rollback_index "$AVB_ROLLBACK_INDEX"
                --rollback_index_location "$AVB_ROLLBACK_INDEX_LOCATION"
                --flags "$AVB_FLAGS"
                --fec_num_roots "$AVB_FEC_ROOTS"
                --internal_release_string "$AVB_RELEASE")
          args+=("${props[@]}")
          printf 'Running: avbtool.py'; printf ' %q' "${args[@]}"; printf '\n'
          python3 /tmp/avb/avbtool.py "${args[@]}" 2>&1 | tee avbtool_add_hashtree_footer.log
          actual="$(stat -c '%s' vendor_a_dfe.img)"
          echo "Final image size after AVB: $actual"
          test "$actual" = "$partition_size"
          sha256sum vendor_a_dfe.img | tee vendor_a_dfe.sha256

      - name: Validate final AVB image
        run: |
          set -euo pipefail
          python3 /tmp/avb/avbtool.py info_image --image vendor_a_dfe.img | tee vendor_a_dfe_avb.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('vendor_a_dfe_avb.txt').read_text()
          def need(p,name):
              if not re.search(p,s,re.M): raise SystemExit('AVB validation failed: '+name)
          need(r'^\s*Footer version:\s+1\.0$', 'footer version')
          need(r'^\s*Original image size:\s+512012288 bytes$', 'original image size')
          need(r'^\s*Algorithm:\s+NONE$', 'algorithm')
          need(r'^\s*FEC num roots:\s+2$', 'FEC roots')
          need(r'^\s*Hash Algorithm:\s+sha256$', 'hash algorithm')
          need(r'^\s*Partition Name:\s+vendor$', 'partition name')
          need(r"^\s*Prop: com\.android\.build\.vendor\.os_version -> '15'$", 'OS version')
          need(r"^\s*Prop: com\.android\.build\.vendor\.security_patch -> '2026-05-01'$", 'security patch')
          need(r"^\s*Prop: com\.android\.build\.vendor\.fingerprint -> 'TECNO/KM5n-OP/TECNO-KM5n:15/AP3A\.240905\.015\.A2/260422V952:user/release-keys'$", 'fingerprint')
          m=re.search(r'^\s*Image Size:\s+(\d+) bytes$',s,re.M)
          if not m or int(m.group(1)) != 512012288: raise SystemExit('hashtree descriptor image size mismatch')
          tree=re.search(r'^\s*Tree Size:\s+(\d+) bytes$',s,re.M)
          fec=re.search(r'^\s*FEC size:\s+(\d+) bytes$',s,re.M)
          if not tree or not fec: raise SystemExit('missing hashtree/FEC sizing')
          print(f'Hashtree size: {tree.group(1)} bytes')
          print(f'FEC size: {fec.group(1)} bytes')
          PY

      - name: Upload AVB-valid DFE image
        uses: actions/upload-artifact@v4
        with:
          name: km5n-vendor-dfe-avb-valid
          path: |
            vendor_a_dfe.img
            vendor_a_dfe.sha256
            vendor_a_dfe_avb.txt
            avb_params.env
            avbtool_version.txt
            avbtool_add_hashtree_footer.log
            source_artifact.txt
