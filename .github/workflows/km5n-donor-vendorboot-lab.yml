name: KM5n Donor vendor_boot Lab

on:
  workflow_dispatch:
    inputs:
      test_name:
        description: 'Test label'
        required: true
        default: 'baseline'
      modification:
        description: 'Modification to apply'
        required: true
        type: choice
        options:
          - none
          - inspect-only
          - magiskboot-control
          - repack-only
          - ueventd-only
          - touch-init
        default: none

permissions:
  contents: read

env:
  DONOR_ARCHIVE: stock/vendor_boot (1).7z
  STOCK_ARCHIVE: stock/vendor_boot.7z

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Extract donor and stock vendor_boot images
        run: |
          set -euxo pipefail
          test -f "$DONOR_ARCHIVE"
          test -f "$STOCK_ARCHIVE"
          sudo apt-get update
          sudo apt-get install -y p7zip-full curl unzip
          rm -rf work/donor-extract work/stock-extract
          mkdir -p work/donor-extract work/stock-extract donor stock
          7z x -y "$DONOR_ARCHIVE" -o"work/donor-extract"
          7z x -y "$STOCK_ARCHIVE" -o"work/stock-extract"
          mapfile -t donor_images < <(find work/donor-extract -type f -iname 'vendor_boot*.img' -size +1M -size -100M | sort)
          mapfile -t stock_images < <(find work/stock-extract -type f -iname 'vendor_boot*.img' -size +1M -size -100M | sort)
          test "${#donor_images[@]}" -ge 1
          test "${#stock_images[@]}" -ge 1
          cp "${donor_images[0]}" donor/vendor_boot.img
          cp "${stock_images[0]}" stock/vendor_boot.img
          echo "DONOR:"
          stat -c 'size=%s' donor/vendor_boot.img
          sha256sum donor/vendor_boot.img
          file donor/vendor_boot.img
          echo "STOCK:"
          stat -c 'size=%s' stock/vendor_boot.img
          sha256sum stock/vendor_boot.img
          file stock/vendor_boot.img
          test "$(stat -c %s donor/vendor_boot.img)" -gt 1048576
          test "$(stat -c %s stock/vendor_boot.img)" -gt 1048576

      - name: Install image tools
        run: |
          set -euxo pipefail
          sudo apt-get install -y android-sdk-libsparse-utils lz4 cpio device-tree-compiler
          pip3 install --disable-pip-version-check lz4

      - name: Install official MagiskBoot
        if: inputs.modification == 'magiskboot-control'
        run: |
          set -euxo pipefail
          curl -fL --retry 3 -o /tmp/Magisk.apk https://github.com/topjohnwu/Magisk/releases/download/v31.0/Magisk-v31.0.apk
          unzip -p /tmp/Magisk.apk lib/x86_64/libmagiskboot.so > /tmp/magiskboot
          chmod 0755 /tmp/magiskboot
          /tmp/magiskboot unpack donor/vendor_boot.img -h || true
          /tmp/magiskboot unpack donor/vendor_boot.img -n -h || true

      - name: MagiskBoot no-op control repack
        if: inputs.modification == 'magiskboot-control'
        run: |
          set -euxo pipefail
          rm -rf work/magiskboot
          mkdir -p work/magiskboot/output
          cp donor/vendor_boot.img work/magiskboot/original.img
          cd work/magiskboot
          /tmp/magiskboot unpack original.img -n -h
          test -f header
          /tmp/magiskboot repack original.img
          test -f new-boot.img
          cp new-boot.img output/vendor_boot.img
          cd ../..
          printf 'mode=magiskboot-control\ninput=donor/vendor_boot.img\nmethod=official MagiskBoot v31.0 no-op unpack/repack; original components preserved with -n\n' > work/manifest.txt
          sha256sum donor/vendor_boot.img work/output/vendor_boot.img | tee work/output/SHA256SUMS

      - name: Normalize generated Python escape sequences
        if: inputs.modification != 'magiskboot-control'
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/km5n_vendorboot_lab.py')
          s = p.read_text()
          s = s.replace(r'\\x', r'\x').replace(r'\\0', r'\0').replace(r'\\n', r'\n')
          p.write_text(s)
          compile(s, str(p), 'exec')
          PY

      - name: Inspect donor
        if: inputs.modification != 'magiskboot-control'
        run: |
          set -euxo pipefail
          mkdir -p work
          python3 scripts/km5n_vendorboot_lab.py inspect donor/vendor_boot.img work

      - name: Apply selected modification
        if: inputs.modification != 'magiskboot-control'
        run: |
          set -euxo pipefail
          python3 scripts/km5n_vendorboot_lab.py modify donor/vendor_boot.img work "${{ inputs.modification }}" "${{ inputs.test_name }}" stock/vendor_boot.img

      - name: Verify output
        run: |
          set -euxo pipefail
          test -f work/output/vendor_boot.img
          stat -c 'output_size=%s' work/output/vendor_boot.img
          sha256sum work/output/vendor_boot.img | tee -a work/output/SHA256SUMS
          file work/output/vendor_boot.img

      - name: Upload flashable vendor_boot
        uses: actions/upload-artifact@v4
        with:
          name: KM5n-${{ inputs.test_name }}-vendor_boot
          path: |
            work/output/vendor_boot.img
            work/output/SHA256SUMS
            work/manifest.txt
            work/diff.txt
          if-no-files-found: error
          retention-days: 14
