name: KM5n Donor vendor_boot Lab

on:
  workflow_dispatch:
    inputs:
      test_name:
        description: 'Test label'
        required: true
        default: 'baseline'
      modification:
        description: 'Modification to apply'
        required: true
        type: choice
        options:
          - none
          - inspect-only
          - aosp-repack-control
          - repack-only
          - ueventd-only
          - touch-init
          - stock-dtb-touch
        default: none

permissions:
  contents: read

env:
  DONOR_ARCHIVE: stock/vendor_boot (1).7z
  STOCK_ARCHIVE: stock/vendor_boot.7z
  MKBOOTIMG_RAW: https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/unpack_bootimg.py?format=TEXT

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false

      - name: Extract donor and stock vendor_boot images
        run: |
          set -euxo pipefail
          test -f "$DONOR_ARCHIVE"
          test -f "$STOCK_ARCHIVE"
          sudo apt-get update
          sudo apt-get install -y p7zip-full mkbootimg lz4 cpio curl
          rm -rf work/donor-extract work/stock-extract
          mkdir -p work/donor-extract work/stock-extract donor stock
          7z x -y "$DONOR_ARCHIVE" -o"work/donor-extract"
          7z x -y "$STOCK_ARCHIVE" -o"work/stock-extract"
          mapfile -t donor_images < <(find work/donor-extract -type f -iname 'vendor_boot*.img' -size +1M -size -100M | sort)
          mapfile -t stock_images < <(find work/stock-extract -type f -iname 'vendor_boot*.img' -size +1M -size -100M | sort)
          test "${#donor_images[@]}" -ge 1
          test "${#stock_images[@]}" -ge 1
          cp "${donor_images[0]}" donor/vendor_boot.img
          cp "${stock_images[0]}" stock/vendor_boot.img
          sha256sum donor/vendor_boot.img stock/vendor_boot.img
          stat -c '%n %s bytes' donor/vendor_boot.img stock/vendor_boot.img

      - name: Install AOSP unpack_bootimg.py
        if: inputs.modification == 'aosp-repack-control'
        run: |
          set -euxo pipefail
          curl -fsSL "$MKBOOTIMG_RAW" | base64 -d > /tmp/unpack_bootimg.py
          chmod +x /tmp/unpack_bootimg.py
          python3 /tmp/unpack_bootimg.py --help >/dev/null

      - name: AOSP v4 no-op repack control
        if: inputs.modification == 'aosp-repack-control'
        run: |
          set -euxo pipefail
          rm -rf work/aosp
          mkdir -p work/aosp
          python3 /tmp/unpack_bootimg.py --boot_img donor/vendor_boot.img --out work/aosp --format=mkbootimg -0 > work/aosp/mkbootimg_args.null
          python3 /tmp/unpack_bootimg.py --boot_img donor/vendor_boot.img --out work/aosp/info
          grep -q 'header version: 4' work/aosp/info || true
          python3 - <<'PY'
          import subprocess
          from pathlib import Path
          args=Path('work/aosp/mkbootimg_args.null').read_bytes().split(b'\0')
          args=[x.decode() for x in args if x]
          out=['mkbootimg']+args+['--vendor_boot','work/aosp/repacked.img']
          subprocess.run(out,check=True)
          PY
          test -s work/aosp/repacked.img
          python3 /tmp/unpack_bootimg.py --boot_img work/aosp/repacked.img --out work/aosp/repacked --format=mkbootimg -0 > work/aosp/repacked_args.null
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, subprocess
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          a=Path('work/aosp'); b=Path('work/aosp/repacked')
          # Compare every extracted payload byte-for-byte. Header metadata is separately checked by mkbootimg.
          names=['vendor_ramdisk00','vendor_ramdisk01','dtb','bootconfig']
          for n in names:
              p=a/n; q=b/n
              if p.exists() or q.exists():
                  assert p.exists() and q.exists(), (n,'missing')
                  assert p.stat().st_size==q.stat().st_size, (n,'size')
                  assert h(p)==h(q), (n,'sha')
          # Require the same number of v4 fragments.
          orig=sorted(a.glob('vendor_ramdisk[0-9][0-9]'))
          new=sorted(b.glob('vendor_ramdisk[0-9][0-9]'))
          assert len(orig)==len(new) and len(orig)>=1, (len(orig),len(new))
          print('AOSP STRUCTURAL CONTROL: PASS')
          print('fragments:',len(orig))
          print('original_sha256:',h('donor/vendor_boot.img'))
          print('repacked_sha256:',h('work/aosp/repacked.img'))
          PY
          cp work/aosp/repacked.img work/output.img
          mkdir -p work/output
          mv work/output.img work/output/vendor_boot.img
          sha256sum donor/vendor_boot.img work/output/vendor_boot.img > work/output/SHA256SUMS
          printf 'mode=aosp-repack-control\nmethod=AOSP unpack_bootimg.py + mkbootimg\nno ramdisk files modified\n' > work/manifest.txt

      - name: Install legacy helper dependencies
        if: inputs.modification != 'aosp-repack-control'
        run: |
          set -euxo pipefail
          sudo apt-get install -y android-sdk-libsparse-utils device-tree-compiler
          pip3 install --disable-pip-version-check lz4

      - name: Normalize helper
        if: inputs.modification != 'aosp-repack-control'
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/km5n_vendorboot_lab.py')
          s=p.read_text()
          s=s.replace(r'\\x',r'\x').replace(r'\\0',r'\0').replace(r'\\n',r'\n')
          p.write_text(s)
          compile(s,str(p),'exec')
          PY

      - name: Inspect donor
        if: inputs.modification != 'aosp-repack-control'
        run: |
          set -euxo pipefail
          mkdir -p work
          python3 scripts/km5n_vendorboot_lab.py inspect donor/vendor_boot.img work

      - name: Apply selected modification
        if: inputs.modification != 'aosp-repack-control'
        run: |
          set -euxo pipefail
          python3 scripts/km5n_vendorboot_lab.py modify donor/vendor_boot.img work "${{ inputs.modification }}" "${{ inputs.test_name }}" stock/vendor_boot.img

      - name: Verify output
        run: |
          set -euxo pipefail
          test -f work/output/vendor_boot.img
          stat -c 'output_size=%s' work/output/vendor_boot.img
          sha256sum work/output/vendor_boot.img | tee -a work/output/SHA256SUMS
          file work/output/vendor_boot.img

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: KM5n-${{ inputs.test_name }}-vendor_boot
          path: |
            work/output/vendor_boot.img
            work/output/SHA256SUMS
            work/manifest.txt
            work/diff.txt
          if-no-files-found: error
          retention-days: 14
