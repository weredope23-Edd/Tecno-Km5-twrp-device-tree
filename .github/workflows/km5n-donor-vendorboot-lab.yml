name: KM5n Donor vendor_boot Lab

on:
  workflow_dispatch:
    inputs:
      test_name:
        description: 'Test label'
        required: true
        default: 'baseline'
      modification:
        description: 'Modification to apply'
        required: true
        type: choice
        options:
          - none
          - inspect-only
          - ueventd-only
          - touch-init
        default: none

permissions:
  contents: read

env:
  DONOR_ARCHIVE: stock/vendor_boot (1).7z

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract donor and stock images
        run: |
          set -euxo pipefail
          test -f "$DONOR_ARCHIVE"
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          rm -rf work/extract
          mkdir -p work/extract donor stock
          7z x -y "$DONOR_ARCHIVE" -o"work/extract"

          echo "Archive contents:"
          find work/extract -type f -printf '%p %s bytes\\n' | sort

          mapfile -t images < <(find work/extract -type f -iname '*.img' -size +1M -size -100M | sort)
          test "${#images[@]}" -gt 0

          echo "Candidate images:"
          printf '%s\\n' "${images[@]}"

          donor_found=""
          stock_found=""

          # Prefer explicit names when the archive contains named copies.
          for f in "${images[@]}"; do
            base="$(basename "$f" | tr '[:upper:]' '[:lower:]')"
            if [[ "$base" == *twrp* || "$base" == *donor* || "$base" == *recovery* ]]; then
              donor_found="$f"
              break
            fi
          done

          # The known donor archive is expected to contain the partially-working
          # TWRP vendor_boot. If there is only one candidate, use it as donor.
          if [[ -z "$donor_found" && "${#images[@]}" -eq 1 ]]; then
            donor_found="${images[0]}"
          fi

          test -n "$donor_found"

          # Stock vendor_boot must come from the repository's LFS-backed file.
          # Refuse to proceed if checkout returned the  pointer.
          test -f stock/vendor_boot.img
          stock_bytes="$(wc -c < stock/vendor_boot.img)"
          if [[ "$stock_bytes" -lt 1048576 ]]; then
            echo "::error::stock/vendor_boot.img is an LFS pointer, not the real image."
            cat stock/vendor_boot.img
            exit 1
          fi

          cp "$donor_found" donor/vendor_boot.img

          echo "Selected donor: $donor_found"
          stat -c 'donor_size=%s' donor/vendor_boot.img
          sha256sum donor/vendor_boot.img
          file donor/vendor_boot.img

          echo "Selected stock: stock/vendor_boot.img"
          stat -c 'stock_size=%s' stock/vendor_boot.img
          sha256sum stock/vendor_boot.img
          file stock/vendor_boot.img

      - name: Install image tools
        run: |
          set -euxo pipefail
          sudo apt-get install -y android-sdk-libsparse-utils lz4 cpio device-tree-compiler
          pip3 install --disable-pip-version-check lz4

      - name: Inspect donor
        run: |
          set -euxo pipefail
          mkdir -p work
          python3 scripts/km5n_vendorboot_lab.py inspect donor/vendor_boot.img work

      - name: Apply selected modification
        run: |
          set -euxo pipefail
          python3 scripts/km5n_vendorboot_lab.py modify donor/vendor_boot.img work "${{ inputs.modification }}" "${{ inputs.test_name }}" stock/vendor_boot.img

      - name: Verify output
        run: |
          set -euxo pipefail
          test -f work/output/vendor_boot.img
          stat -c 'output_size=%s' work/output/vendor_boot.img
          sha256sum work/output/vendor_boot.img | tee work/output/SHA256SUMS
          file work/output/vendor_boot.img

      - name: Upload flashable vendor_boot
        uses: actions/upload-artifact@v4
        with:
          name: KM5n-${{ inputs.test_name }}-vendor_boot
          path: |
            work/output/vendor_boot.img
            work/output/SHA256SUMS
            work/manifest.txt
            work/diff.txt
          if-no-files-found: error
          retention-days: 14
