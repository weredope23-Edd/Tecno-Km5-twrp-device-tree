name: Lightweight TWRP vendor_boot port (KM5n)

on:
  push:
  workflow_dispatch:
    inputs:
      donor_vendor_boot_url:
        description: 'Compatible TWRP vendor_boot donor; default is the Tecno CK6n donor'
        required: false
        default: 'https://github.com/chunix64/twrp_TECNO-CK6n/releases/download/v1.0.0/TWRP_vendor_boot_v1.0.0.img'
        type: string

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate stock input
        run: |
          set -euxo pipefail
          test "$(stat -c '%s' stock/vendor_boot.img)" -eq 67108864
          sha256sum stock/vendor_boot.img
      - name: Prepare tools
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl python3
          mkdir -p /tmp/mkbootimg/gki
          curl -fsSL 'https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/mkbootimg.py?format=TEXT' | base64 -d > /tmp/mkbootimg/mkbootimg.py
          curl -fsSL 'https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/gki/generate_gki_certificate.py?format=TEXT' | base64 -d > /tmp/mkbootimg/gki/generate_gki_certificate.py
          python3 -m py_compile /tmp/mkbootimg/mkbootimg.py
      - name: Fetch CK6n donor
        env:
          DONOR_URL: ${{ inputs.donor_vendor_boot_url || 'https://github.com/chunix64/twrp_TECNO-CK6n/releases/download/v1.0.0/TWRP_vendor_boot_v1.0.0.img' }}
        run: curl -fL --retry 5 --retry-all-errors "$DONOR_URL" -o /tmp/donor_vendor_boot.img
      - name: Build optimized port
        run: |
          set -euxo pipefail
          MKBOOTIMG=/tmp/mkbootimg/mkbootimg.py PYTHONPATH=/tmp/mkbootimg scripts/port_twrp16_vendor_boot.sh stock/vendor_boot.img /tmp/donor_vendor_boot.img /tmp/km5n-twrp-vendor_boot.img
      - name: Independent structural audit
        run: |
          set -euxo pipefail
          test "$(stat -c '%s' /tmp/km5n-twrp-vendor_boot.img)" -eq 67108864
          python3 - /tmp/km5n-twrp-vendor_boot.img <<'PY'
          import struct,sys
          d=open(sys.argv[1],'rb').read(); P=4096; E=108; A=lambda x:(x+P-1)//P*P
          assert d[:8]==b'VNDRBOOT' and struct.unpack_from('<II',d,8)==(4,P)
          hs=struct.unpack_from('<I',d,2096)[0]; rsz=struct.unpack_from('<I',d,24)[0]; dtb=struct.unpack_from('<I',d,2100)[0]
          tsz,n,esz=struct.unpack_from('<III',d,2112); bcsz=struct.unpack_from('<I',d,2124)[0]
          assert hs==2128 and esz==E and tsz>=n*E
          ram=A(hs); table=ram+A(rsz)+A(dtb); phys=ram; raw=0; rec=[]
          for i in range(n):
            e=table+i*E; size,logical,typ=struct.unpack_from('<III',d,e); name=d[e+12:e+44].split(b'\0',1)[0]
            assert logical==raw and phys+size<=table-A(dtb)
            if typ==2 or name==b'recovery': rec.append((i,size,name))
            raw+=size; phys+=A(size)
          assert phys==table-A(dtb) and len(rec)==1
          assert table+ A(tsz)+bcsz <= len(d)
          print('PASS: v4 table, logical offsets, per-fragment padding, DTB and bootconfig bounds')
          print('Recovery entry:',rec[0])
          PY
          sha256sum /tmp/km5n-twrp-vendor_boot.img
      - name: Upload port
        uses: actions/upload-artifact@v4
        with:
          name: km5n-twrp-vendor-boot-port-optimized
          path: /tmp/km5n-twrp-vendor_boot.img
          if-no-files-found: error
