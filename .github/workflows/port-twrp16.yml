name: Lightweight TWRP vendor_boot port (KM5n)

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/port-twrp16.yml'
  workflow_dispatch:
    inputs:
      donor_vendor_boot_url:
        description: 'Compatible TWRP vendor_boot donor; default is the Tecno CK6n donor'
        required: false
        default: 'https://github.com/chunix64/twrp_TECNO-CK6n/releases/download/v1.0.0/TWRP_vendor_boot_v1.0.0.img'
        type: string

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate repository stock vendor_boot
        run: |
          set -euxo pipefail
          test -f stock/vendor_boot.img
          test "$(stat -c '%s' stock/vendor_boot.img)" -eq 67108864
          echo 'Stock KM5n vendor_boot:'
          sha256sum stock/vendor_boot.img

      - name: Prepare tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl unzip xz-utils lz4 cpio
          curl -fsSL https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk -o /tmp/magisk.apk
          unzip -p /tmp/magisk.apk lib/x86_64/libmagiskboot.so > /tmp/magiskboot
          chmod +x /tmp/magiskboot
          /tmp/magiskboot --help >/dev/null
          /tmp/magiskboot --version || true

      - name: Inspect stock vendor_boot
        run: |
          set -euxo pipefail
          mkdir -p /tmp/stock-check
          cp stock/vendor_boot.img /tmp/stock-check/boot.img
          cd /tmp/stock-check
          /tmp/magiskboot unpack -h boot.img
          test -s vendor_ramdisk_recovery.cpio
          echo 'Stock recovery component:'
          stat -c '%n %s bytes' vendor_ramdisk_recovery.cpio

      - name: Fetch donor TWRP vendor_boot
        env:
          DONOR_URL: ${{ inputs.donor_vendor_boot_url || 'https://github.com/chunix64/twrp_TECNO-CK6n/releases/download/v1.0.0/TWRP_vendor_boot_v1.0.0.img' }}
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --retry-all-errors "$DONOR_URL" -o /tmp/donor_vendor_boot.img
          test -s /tmp/donor_vendor_boot.img
          sha256sum /tmp/donor_vendor_boot.img

      - name: Port only the recovery ramdisk
        run: |
          set -euxo pipefail
          chmod +x scripts/port_twrp16_vendor_boot.sh
          PATH="/tmp:$PATH" scripts/port_twrp16_vendor_boot.sh \
            stock/vendor_boot.img \
            /tmp/donor_vendor_boot.img \
            /tmp/km5n-twrp-vendor_boot.img

      - name: Inspect final vendor_boot
        run: |
          set -euxo pipefail
          mkdir -p /tmp/final-check
          cp /tmp/km5n-twrp-vendor_boot.img /tmp/final-check/boot.img
          cd /tmp/final-check
          /tmp/magiskboot unpack -h boot.img
          test -s vendor_ramdisk_recovery.cpio
          test "$(stat -c '%s' boot.img)" -eq 67108864
          echo 'Final recovery component:'
          stat -c '%n %s bytes' vendor_ramdisk_recovery.cpio
          echo 'Final image:'
          sha256sum boot.img

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: km5n-twrp-vendor-boot-port
          path: /tmp/km5n-twrp-vendor_boot.img
          if-no-files-found: error
