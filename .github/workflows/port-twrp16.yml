name: Lightweight TWRP vendor_boot port (KM5n)

on:
  workflow_dispatch:
    inputs:
      donor_vendor_boot_url:
        description: 'Compatible TWRP vendor_boot donor; default is the Tecno CK6n donor'
        required: false
        default: 'https://github.com/chunix64/twrp_TECNO-CK6n/releases/download/v1.0.0/TWRP_vendor_boot_v1.0.0.img'
        type: string

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate repository stock vendor_boot
        run: |
          set -euxo pipefail
          test -f stock/vendor_boot.img
          test "$(stat -c '%s' stock/vendor_boot.img)" -eq 67108864
          sha256sum stock/vendor_boot.img
      - name: Prepare AOSP mkbootimg
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl python3
          mkdir -p /tmp/mkbootimg/gki
          curl -fsSL 'https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/mkbootimg.py?format=TEXT' | base64 -d > /tmp/mkbootimg/mkbootimg.py
          curl -fsSL 'https://android.googlesource.com/platform/system/tools/mkbootimg/+/refs/heads/main/gki/generate_gki_certificate.py?format=TEXT' | base64 -d > /tmp/mkbootimg/gki/generate_gki_certificate.py
          python3 -m py_compile /tmp/mkbootimg/mkbootimg.py /tmp/mkbootimg/gki/generate_gki_certificate.py
      - name: Fetch donor
        env:
          DONOR_URL: ${{ inputs.donor_vendor_boot_url || 'https://github.com/chunix64/twrp_TECNO-CK6n/releases/download/v1.0.0/TWRP_vendor_boot_v1.0.0.img' }}
        run: curl -fL --retry 5 --retry-all-errors "$DONOR_URL" -o /tmp/donor_vendor_boot.img
      - name: Port recovery fragment
        run: |
          set -euxo pipefail
          MKBOOTIMG=/tmp/mkbootimg/mkbootimg.py PYTHONPATH=/tmp/mkbootimg scripts/port_twrp16_vendor_boot.sh stock/vendor_boot.img /tmp/donor_vendor_boot.img /tmp/km5n-twrp-vendor_boot.img
      - name: Validate output
        run: |
          set -euxo pipefail
          test "$(stat -c '%s' /tmp/km5n-twrp-vendor_boot.img)" -eq 67108864
          python3 - /tmp/km5n-twrp-vendor_boot.img <<'PY'
          import struct,sys
          d=open(sys.argv[1],'rb').read(); PAGE=4096; ENTRY=108
          assert d[:8]==b'VNDRBOOT'
          assert struct.unpack_from('<II',d,8)==(4,PAGE)
          hs=struct.unpack_from('<I',d,2096)[0]; rsz=struct.unpack_from('<I',d,24)[0]
          dtbsz=struct.unpack_from('<I',d,2100)[0]; tsz,n,esz=struct.unpack_from('<III',d,2112)
          bcsz=struct.unpack_from('<I',d,2124)[0]
          assert hs==2128 and esz==ENTRY and tsz>=n*esz
          align=lambda x:(x+PAGE-1)//PAGE*PAGE
          ramoff=align(hs); tableoff=ramoff+sum(align(struct.unpack_from('<I',d,0)[0]) for _ in [])
          physical=ramoff
          entries=[]
          # The table's logical ramdisk offsets are raw-byte offsets; physical
          # fragment locations advance by each fragment's individually padded size.
          # Table itself follows the physically padded ramdisk section and DTB.
          tableoff=ramoff+align(rsz)+align(dtbsz)
          for i in range(n):
            e=tableoff+i*esz; size,logical,typ=struct.unpack_from('<III',d,e)
            name=d[e+12:e+44].split(b'\0',1)[0]
            assert logical==sum(x[0] for x in entries)
            assert physical+size <= tableoff-align(dtbsz)
            entries.append((size,logical,typ,name)); physical += align(size)
          assert physical==tableoff-align(dtbsz)
          assert tableoff+align(tsz)+bcsz <= len(d)
          rec=[x for x in entries if x[2]==2 or x[3]==b'recovery']
          assert len(rec)==1
          print('valid vendor_boot v4 recovery table; per-fragment physical padding verified')
          PY
          sha256sum /tmp/km5n-twrp-vendor_boot.img
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: km5n-twrp-vendor-boot-port
          path: /tmp/km5n-twrp-vendor_boot.img
          if-no-files-found: error
