name: Build TWRP KM5n (TWRP 16.0)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # The maximize action mounts the reclaimed runner space over GITHUB_WORKSPACE.
      # Keep the entire Android/TWRP source tree there; HOME remains on the small
      # root filesystem and is not suitable for an AOSP source checkout.
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          temp-reserve-mb: 128
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Show runner disk space
        run: |
          set -eux
          df -h
          df -h /mnt || true
          df -h "$GITHUB_WORKSPACE"

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 lib32ncurses6 lib32z1 \
            libssl-dev bc rsync libelf-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install repo
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP source
        run: |
          set -uo pipefail
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp"
          mkdir -p "$TWRP_DIR"
          cd "$TWRP_DIR"

          echo '=== Repo version ==='
          repo version
          echo '=== Disk before repo init ==='
          df -h "$GITHUB_WORKSPACE"

          repo init \
            -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git \
            -b twrp-16.0 \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:none

          # TWRP-Test ships a maintained Android 16 minimal manifest which removes
          # emulator, CTS, app, test, multimedia and other projects not needed to
          # build recovery. The full AOSP manifest exceeds this runner's usable
          # source volume and previously exhausted the 31 GB build filesystem.
          mkdir -p .repo/local_manifests
          curl -fsSL \
            https://raw.githubusercontent.com/TWRP-Test/platform_manifest_twrp_aosp/twrp-16.0/remove-minimal.xml \
            -o .repo/local_manifests/remove-minimal.xml
          test -s .repo/local_manifests/remove-minimal.xml

          echo '=== Manifest initialized ==='
          test -f .repo/manifest.xml
          wc -l .repo/manifest.xml
          wc -l .repo/local_manifests/remove-minimal.xml

          echo '=== Disk before repo sync ==='
          df -h "$GITHUB_WORKSPACE"

          set -x
          repo sync \
            -c \
            -j1 \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --retry-fetches=5 \
            --prune \
            --fail-fast 2>&1 | tee repo-sync.log
          sync_rc=${PIPESTATUS[0]}
          set +x

          echo "repo sync exit code: ${sync_rc}"
          echo '=== Disk after repo sync ==='
          df -h "$GITHUB_WORKSPACE"
          du -sh .repo 2>/dev/null || true
          du -sh -- */ 2>/dev/null | sort -h | tail -30 || true

          exit "$sync_rc"

      - name: Add KM5n device tree
        run: |
          set -euxo pipefail
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp"
          mkdir -p "$TWRP_DIR/device/tecno/km5n"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='twrp/' \
            "$GITHUB_WORKSPACE/" \
            "$TWRP_DIR/device/tecno/km5n/"

      - name: Build TWRP vendor_boot
        run: |
          set -euxo pipefail
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp"
          cd "$TWRP_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export TMPDIR="$TWRP_DIR/tmp"
          mkdir -p "$TMPDIR"

          echo '=== Disk before build ==='
          df -h "$GITHUB_WORKSPACE"

          source build/envsetup.sh
          lunch twrp_km5n-eng
          mka vendorbootimage -j2

          test -s out/target/product/km5n/vendor_boot.img
          stat -c '%n %s bytes' out/target/product/km5n/vendor_boot.img

          bash device/tecno/km5n/scripts/validate_vendor_boot.sh \
            out/target/product/km5n/vendor_boot.img
          bash device/tecno/km5n/scripts/audit_twrp_output.sh \
            out/target/product/km5n

      - name: Collect build logs on failure
        if: failure()
        run: |
          set +e
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp"
          cd "$TWRP_DIR" 2>/dev/null || exit 0
          mkdir -p build-debug
          cp -f repo-sync.log build-debug/ 2>/dev/null || true
          cp -f repo-manifest.txt build-debug/ 2>/dev/null || true
          cp -f .repo/manifest.xml build-debug/manifest.xml 2>/dev/null || true
          cp -f .repo/local_manifests/remove-minimal.xml build-debug/ 2>/dev/null || true
          cp -f out/soong/build.ninja build-debug/ 2>/dev/null || true
          cp -f out/verbose.log.gz build-debug/ 2>/dev/null || true
          find out/target/product/km5n -maxdepth 2 -type f \
            \( -name 'build.prop' -o -name '*recovery*.log' -o -name '*.mk' \) \
            -print > build-debug/output-files.txt 2>/dev/null || true
          df -h "$GITHUB_WORKSPACE" > build-debug/disk.txt 2>&1 || true
          du -sh "$TWRP_DIR"/* 2>/dev/null | sort -h > build-debug/top-level-disk.txt || true

      - name: Upload build output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twrp-km5n-build-output
          path: |
            ${{ github.workspace }}/twrp/out/target/product/km5n/vendor_boot.img
            ${{ github.workspace }}/twrp/build-debug/**
          if-no-files-found: warn
