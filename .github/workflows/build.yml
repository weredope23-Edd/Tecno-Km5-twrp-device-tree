name: Build TWRP KM5n (TWRP 16.0)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free runner disk space
        run: |
          set -euxo pipefail
          echo '=== Disk before cleanup ==='
          df -h /

          # Keep the active JDK; Android build needs Java. Remove other cached
          # tool versions and large image-only SDKs that this source build does not use.
          if [ -n "${JAVA_HOME:-}" ] && [ -d "$JAVA_HOME" ]; then
            JAVA_HOME_REAL="$(readlink -f "$JAVA_HOME")"
            for d in /opt/hostedtoolcache/Java_*/*; do
              [ -d "$d" ] || continue
              if [ "$(readlink -f "$d/x64" 2>/dev/null || true)" != "$JAVA_HOME_REAL" ]; then
                sudo rm -rf "$d"
              fi
            done
          fi

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /opt/mssql || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/share/vscode || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/az || true
          sudo rm -rf /usr/local/julia* || true
          sudo rm -rf /usr/local/.cache /root/.cache || true
          sudo docker system prune -af || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true

          echo '=== Disk after cleanup ==='
          df -h /

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          temp-reserve-mb: 128
          swap-size-mb: 1024
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Show runner disk space
        run: |
          set -eux
          df -h
          df -h /mnt || true
          df -h "$GITHUB_WORKSPACE"

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 lib32ncurses6 lib32z1 \
            libssl-dev bc rsync libelf-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install repo
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP source
        run: |
          set -uo pipefail
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp"
          mkdir -p "$TWRP_DIR"
          cd "$TWRP_DIR"

          repo init \
            -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git \
            -b twrp-16.0 \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:none

          mkdir -p .repo/local_manifests
          curl -fsSL \
            https://raw.githubusercontent.com/TWRP-Test/platform_manifest_twrp_aosp/twrp-16.0/remove-minimal.xml \
            -o .repo/local_manifests/remove-minimal.xml
          test -s .repo/local_manifests/remove-minimal.xml

          # Current TWRP-Test minimal manifest contains removals by both name and
          # path. repo supports optional=true for stale removals, so mark every
          # removal optional. This keeps the minimal manifest compatible when the
          # upstream base manifest drops a project.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.repo/local_manifests/remove-minimal.xml')
          s = p.read_text()
          s = s.replace('<remove-project ', '<remove-project optional="true" ')
          s = s.replace('<remove-project optional="true" optional="true" ', '<remove-project optional="true" ')
          p.write_text(s)
          PY

          echo '=== Manifest initialized ==='
          test -f .repo/manifest.xml
          wc -l .repo/manifest.xml
          wc -l .repo/local_manifests/remove-minimal.xml
          grep -c '<remove-project ' .repo/local_manifests/remove-minimal.xml || true

          echo '=== Disk before repo sync ==='
          df -h "$GITHUB_WORKSPACE"

          set -x
          repo sync \
            -c \
            -j1 \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --retry-fetches=5 \
            --prune \
            --fail-fast 2>&1 | tee repo-sync.log
          sync_rc=${PIPESTATUS[0]}
          set +x

          echo "repo sync exit code: ${sync_rc}"
          echo '=== Disk after repo sync ==='
          df -h "$GITHUB_WORKSPACE"
          du -sh .repo 2>/dev/null || true
          du -sh -- */ 2>/dev/null | sort -h | tail -30 || true
          exit "$sync_rc"

      - name: Add KM5n device tree
        run: |
          set -euxo pipefail
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp"
          mkdir -p "$TWRP_DIR/device/tecno/km5n"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='twrp/' \
            "$GITHUB_WORKSPACE/" \
            "$TWRP_DIR/device/tecno/km5n/"

      - name: Build TWRP vendor_boot
        run: |
          set -euxo pipefail
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp"
          cd "$TWRP_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export TMPDIR="$TWRP_DIR/tmp"
          mkdir -p "$TMPDIR"

          echo '=== Disk before build ==='
          df -h "$GITHUB_WORKSPACE"

          source build/envsetup.sh
          lunch twrp_km5n-eng
          mka vendorbootimage -j2

          test -s out/target/product/km5n/vendor_boot.img
          stat -c '%n %s bytes' out/target/product/km5n/vendor_boot.img
          bash device/tecno/km5n/scripts/validate_vendor_boot.sh out/target/product/km5n/vendor_boot.img
          bash device/tecno/km5n/scripts/audit_twrp_output.sh out/target/product/km5n

      - name: Collect build logs on failure
        if: failure()
        run: |
          set +e
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp"
          cd "$TWRP_DIR" 2>/dev/null || exit 0
          mkdir -p build-debug
          cp -f repo-sync.log build-debug/ 2>/dev/null || true
          cp -f .repo/manifest.xml build-debug/manifest.xml 2>/dev/null || true
          cp -f .repo/local_manifests/remove-minimal.xml build-debug/ 2>/dev/null || true
          cp -f out/soong/build.ninja build-debug/ 2>/dev/null || true
          cp -f out/verbose.log.gz build-debug/ 2>/dev/null || true
          find out/target/product/km5n -maxdepth 2 -type f \
            \( -name 'build.prop' -o -name '*recovery*.log' -o -name '*.mk' \) \
            -print > build-debug/output-files.txt 2>/dev/null || true
          df -h "$GITHUB_WORKSPACE" > build-debug/disk.txt 2>&1 || true
          du -sh "$TWRP_DIR"/* 2>/dev/null | sort -h > build-debug/top-level-disk.txt || true

      - name: Upload build output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twrp-km5n-build-output
          path: |
            ${{ github.workspace }}/twrp/out/target/product/km5n/vendor_boot.img
            ${{ github.workspace }}/twrp/build-debug/**
          if-no-files-found: warn
