name: Build TWRP KM5n (TWRP 16.0)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # Android/TWRP source trees are much larger than the free space on a
      # standard GitHub runner. Reclaim the runner's unused root/temp space
      # before checkout so the source tree and out/ can coexist.
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          temp-reserve-mb: 256
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Show runner disk space
        run: |
          set -eux
          df -h
          df -h /mnt || true

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 lib32ncurses6 lib32z1 \
            libssl-dev bc rsync libelf-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install repo
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP source
        run: |
          set -uo pipefail
          mkdir -p "$HOME/twrp"
          cd "$HOME/twrp"

          echo '=== Repo version ==='
          repo version
          echo '=== Disk before repo init ==='
          df -h

          repo init \
            -u https://github.com/TWRP-Test/platform_manifest_twrp_aosp.git \
            -b twrp-16.0 \
            --depth=1

          echo '=== Repo manifest ==='
          repo manifest -r > repo-manifest.txt
          wc -l repo-manifest.txt

          echo '=== Disk before repo sync ==='
          df -h

          # A shallow AOSP/TWRP tree is still very large. Use one sync worker
          # to reduce peak disk/network pressure and retry transient fetches.
          set -x
          repo sync \
            -c \
            -j1 \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --retry-fetches=5 \
            --prune \
            --fail-fast 2>&1 | tee repo-sync.log
          sync_rc=${PIPESTATUS[0]}
          set +x

          echo "repo sync exit code: ${sync_rc}"
          echo '=== Disk after repo sync ==='
          df -h
          du -sh .repo 2>/dev/null || true
          du -sh -- */ 2>/dev/null | sort -h | tail -30 || true

          exit "$sync_rc"

      - name: Add KM5n device tree
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/twrp/device/tecno/km5n"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            "$GITHUB_WORKSPACE/" \
            "$HOME/twrp/device/tecno/km5n/"

      - name: Build TWRP vendor_boot
        run: |
          set -euxo pipefail
          cd "$HOME/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export TMPDIR="$HOME/twrp/tmp"
          mkdir -p "$TMPDIR"

          echo '=== Disk before build ==='
          df -h

          source build/envsetup.sh
          lunch twrp_km5n-eng
          mka vendorbootimage -j2

          test -s out/target/product/km5n/vendor_boot.img
          stat -c '%n %s bytes' out/target/product/km5n/vendor_boot.img

          bash device/tecno/km5n/scripts/validate_vendor_boot.sh \
            out/target/product/km5n/vendor_boot.img
          bash device/tecno/km5n/scripts/audit_twrp_output.sh \
            out/target/product/km5n

      - name: Collect build logs on failure
        if: failure()
        run: |
          set +e
          cd "$HOME/twrp"
          mkdir -p build-debug
          cp -f repo-sync.log build-debug/ 2>/dev/null || true
          cp -f repo-manifest.txt build-debug/ 2>/dev/null || true
          cp -f out/soong/build.ninja build-debug/ 2>/dev/null || true
          cp -f out/verbose.log.gz build-debug/ 2>/dev/null || true
          find out/target/product/km5n -maxdepth 2 -type f \
            \( -name 'build.prop' -o -name '*recovery*.log' -o -name '*.mk' \) \
            -print > build-debug/output-files.txt 2>/dev/null || true
          df -h > build-debug/disk.txt 2>&1 || true
          du -sh "$HOME/twrp"/* 2>/dev/null | sort -h > build-debug/top-level-disk.txt || true

      - name: Upload build output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twrp-km5n-build-output
          path: |
            ${{ env.HOME }}/twrp/out/target/product/km5n/vendor_boot.img
            ${{ env.HOME }}/twrp/build-debug/**
          if-no-files-found: warn
