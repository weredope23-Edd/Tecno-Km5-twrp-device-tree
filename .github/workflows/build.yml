name: Build TWRP KM5n (TWRP 14)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Cleanup runner
        uses: rokibhasansagar/slimhub_actions@main

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dependencies
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 lib32ncurses6 lib32z1 \
            libssl-dev bc rsync libelf-dev python3
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          java -version
          df -h /

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 512
          temp-reserve-mb: 128
          swap-size-mb: 1024
          remove-dotnet: 'false'
          remove-android: 'false'
          remove-haskell: 'false'
          remove-codeql: 'false'
          remove-docker-images: 'false'

      - name: Install repo
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP 14 source
        run: |
          set -euxo pipefail
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp"
          mkdir -p "$TWRP_DIR"
          cd "$TWRP_DIR"

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14 \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:none

          mkdir -p .repo/local_manifests
          curl -fsSL \
            https://raw.githubusercontent.com/minimal-manifest-twrp/platform_manifest_twrp_aosp/twrp-14/remove-minimal.xml \
            -o .repo/local_manifests/remove-minimal.xml
          test -s .repo/local_manifests/remove-minimal.xml

          python3 - <<'PY'
          from pathlib import Path
          p = Path('.repo/local_manifests/remove-minimal.xml')
          s = p.read_text()
          s = s.replace('<remove-project ', '<remove-project optional="true" ')
          s = s.replace('<remove-project optional="true" optional="true" ', '<remove-project optional="true" ')
          p.write_text(s)
          PY

          repo sync \
            -c \
            -j1 \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --retry-fetches=5 \
            --prune \
            --fail-fast 2>&1 | tee repo-sync.log

      - name: Add KM5n device tree
        run: |
          set -euxo pipefail
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp"
          mkdir -p "$TWRP_DIR/device/tecno/km5n"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='twrp/' \
            "$GITHUB_WORKSPACE/" \
            "$TWRP_DIR/device/tecno/km5n/"

      - name: Verify TWRP 14 target
        run: |
          set -euxo pipefail
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp"
          cd "$TWRP_DIR"
          if grep -R -nE 'twrp-14\\.1|twrp-16\\.0' device/tecno/km5n .repo/local_manifests; then
            echo 'ERROR: newer TWRP branch reference found in TWRP 14 build inputs.'
            exit 1
          fi
          grep -q 'PRODUCT_NAME := twrp_km5n' device/tecno/km5n/twrp_km5n.mk
          grep -q 'TARGET_BOARD_PLATFORM := mt6768' device/tecno/km5n/BoardConfig.mk
          grep -q 'BOARD_BOOT_HEADER_VERSION := 4' device/tecno/km5n/BoardConfig.mk

      - name: Build TWRP 14 vendor_boot
        run: |
          set -euxo pipefail
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp"
          cd "$TWRP_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export TMPDIR="$TWRP_DIR/tmp"
          mkdir -p "$TMPDIR"
          source build/envsetup.sh
          lunch twrp_km5n-eng
          mka vendorbootimage -j2
          test -s out/target/product/km5n/vendor_boot.img
          stat -c '%n %s bytes' out/target/product/km5n/vendor_boot.img
          bash device/tecno/km5n/scripts/validate_vendor_boot.sh out/target/product/km5n/vendor_boot.img
          bash device/tecno/km5n/scripts/audit_twrp_output.sh out/target/product/km5n

      - name: Collect build logs on failure
        if: failure()
        run: |
          set +e
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp"
          cd "$TWRP_DIR" 2>/dev/null || exit 0
          mkdir -p build-debug
          cp -f repo-sync.log build-debug/ 2>/dev/null || true
          cp -f .repo/manifest.xml build-debug/manifest.xml 2>/dev/null || true
          cp -f .repo/local_manifests/remove-minimal.xml build-debug/ 2>/dev/null || true
          cp -f out/soong/build.ninja build-debug/ 2>/dev/null || true
          cp -f out/verbose.log.gz build-debug/ 2>/dev/null || true
          df -h "$GITHUB_WORKSPACE" > build-debug/disk.txt 2>&1 || true

      - name: Upload build output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twrp-km5n-twrp14-build-output
          path: |
            ${{ github.workspace }}/twrp/out/target/product/km5n/vendor_boot.img
            ${{ github.workspace }}/twrp/build-debug/**
          if-no-files-found: warn
