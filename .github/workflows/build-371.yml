name: Build TWRP KM5n (3.7.1 / Android 14)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Avoid the third-party runner cleaner: on current Ubuntu images it can
      # spend many minutes purging packages we do not need. The build-space
      # action plus the small manual cleanup below are sufficient.
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        continue-on-error: true
        with:
          root-reserve-mb: 512
          temp-reserve-mb: 128
          swap-size-mb: 1024
          remove-dotnet: 'false'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          # The hosted image may not contain docker after cleanup. Do not ask
          # the action to invoke docker; it is not needed for this build.
          remove-docker-images: 'false'

      - name: Manual disk cleanup fallback
        run: |
          set -eo pipefail
          # Hosted runner images vary; these are optional caches/toolchains.
          sudo rm -rf /usr/local/lib/android /usr/local/.ghcup /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /usr/local/share/powershell /opt/ghc 2>/dev/null || true
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/* 2>/dev/null || true
          sudo rm -rf /tmp/* /var/tmp/* 2>/dev/null || true
          df -h /
          df -h "$GITHUB_WORKSPACE"

      - name: Checkout device tree
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dependencies
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            sudo apt-get update && break
            echo "apt update failed; retry ${attempt}/3"
            sleep 5
          done
          sudo apt-get install -y --no-install-recommends \
            openjdk-17-jdk-headless \
            git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev libc6-dev-i386 lib32ncurses6 lib32z1 \
            libssl-dev bc rsync libelf-dev
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          java -version

      - name: Show runner disk space
        run: |
          set -eux
          df -h /
          df -h "$GITHUB_WORKSPACE"

      - name: Install repo
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP 3.7.1 source
        run: |
          set -uo pipefail
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp371"
          mkdir -p "$TWRP_DIR"
          cd "$TWRP_DIR"

          repo init \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-14 \
            --depth=1 \
            --partial-clone \
            --clone-filter=blob:none

          mkdir -p .repo/local_manifests
          curl -fsSL \
            https://raw.githubusercontent.com/minimal-manifest-twrp/platform_manifest_twrp_aosp/twrp-14/remove-minimal.xml \
            -o .repo/local_manifests/remove-minimal.xml
          test -s .repo/local_manifests/remove-minimal.xml

          python3 - <<'PY'
          from pathlib import Path
          p = Path('.repo/local_manifests/remove-minimal.xml')
          s = p.read_text()
          s = s.replace('<remove-project ', '<remove-project optional="true" ')
          s = s.replace('<remove-project optional="true" optional="true" ', '<remove-project optional="true" ')
          p.write_text(s)
          PY

          echo '=== Manifest initialized ==='
          test -f .repo/manifest.xml
          wc -l .repo/manifest.xml
          wc -l .repo/local_manifests/remove-minimal.xml
          df -h "$GITHUB_WORKSPACE"

          set -x
          # Four concurrent projects is a better compromise for the hosted
          # runner: the previous -j1 sync took ~41 minutes.
          repo sync \
            -c \
            -j4 \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --retry-fetches=5 \
            --prune \
            --fail-fast 2>&1 | tee repo-sync.log
          sync_rc=${PIPESTATUS[0]}
          set +x

          echo "repo sync exit code: ${sync_rc}"
          df -h "$GITHUB_WORKSPACE"
          du -sh .repo 2>/dev/null || true
          du -sh -- */ 2>/dev/null | sort -h | tail -30 || true
          exit "$sync_rc"

      - name: Add KM5n device tree
        run: |
          set -euxo pipefail
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp371"
          mkdir -p "$TWRP_DIR/device/tecno/km5n"

          # Copy only the device tree; never copy the whole workspace into
          # itself, which recursively duplicates twrp371/.repo.
          rsync -a \
            --exclude='.git' \
            "$GITHUB_WORKSPACE/device/tecno/km5n/" \
            "$TWRP_DIR/device/tecno/km5n/"

          cp -f \
            "$TWRP_DIR/device/tecno/km5n/configs/twrp371/BoardConfig.mk" \
            "$TWRP_DIR/device/tecno/km5n/BoardConfig.mk"
          cp -f \
            "$TWRP_DIR/device/tecno/km5n/configs/twrp371/device.mk" \
            "$TWRP_DIR/device/tecno/km5n/device.mk"
          cp -f \
            "$TWRP_DIR/device/tecno/km5n/configs/twrp371/twrp_km5n.mk" \
            "$TWRP_DIR/device/tecno/km5n/twrp_km5n.mk"

          # Android 14 lunch requires an explicit release component.
          cat > "$TWRP_DIR/device/tecno/km5n/AndroidProducts.mk" <<'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/twrp_km5n.mk

          COMMON_LUNCH_CHOICES := \
              twrp_km5n-ap2a-eng \
              twrp_km5n-ap2a-userdebug
          EOF

          echo '=== Active TWRP 3.7.1 BoardConfig ==='
          grep -E 'BOARD_BOOT_HEADER_VERSION|BOARD_MOVE_RECOVERY|BOARD_INCLUDE_RECOVERY|TW_INCLUDE_FBE|TW_LOAD_VENDOR_BOOT|TW_DEVICE_VERSION' \
            "$TWRP_DIR/device/tecno/km5n/BoardConfig.mk"
          echo '=== Android 14 lunch choices ==='
          cat "$TWRP_DIR/device/tecno/km5n/AndroidProducts.mk"
          echo '=== Device release config ==='
          cat "$TWRP_DIR/device/tecno/km5n/release/release_config_map.mk"
          cat "$TWRP_DIR/device/tecno/km5n/release/ap2a.mk"

      - name: Reclaim repo metadata before build
        run: |
          set -euxo pipefail
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp371"
          # repo metadata is required for sync only, not for the actual build.
          # Keeping it can consume most of the hosted runner filesystem.
          du -sh "$TWRP_DIR/.repo" 2>/dev/null || true
          rm -rf "$TWRP_DIR/.repo"
          df -h "$GITHUB_WORKSPACE"
          du -sh "$TWRP_DIR" 2>/dev/null || true

      - name: Build TWRP 3.7.1 vendor_boot
        run: |
          # Android's envsetup.sh is not nounset-safe. Keep -u off while
          # sourcing envsetup/lunch, then enable strict mode for the build.
          set -eo pipefail
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp371"
          cd "$TWRP_DIR"
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export TMPDIR="$TWRP_DIR/tmp"
          mkdir -p "$TMPDIR"

          echo '=== Disk before build ==='
          df -h "$GITHUB_WORKSPACE"

          echo '=== Release config files visible to Android build ==='
          find device/tecno/km5n/release -maxdepth 2 -type f -print -exec sed -n '1,80p' {} \;
          echo '=== Release config maps in source ==='
          find device vendor build/release -name 'release_config_map.mk' -o -name 'release_config_map.textproto' 2>/dev/null | sort | head -100

          source build/envsetup.sh
          lunch twrp_km5n-ap2a-eng

          set -u
          echo '=== Selected build variables ==='
          get_build_var TARGET_PRODUCT
          get_build_var TARGET_RELEASE
          get_build_var TARGET_BUILD_VARIANT
          get_build_var PRODUCT_RELEASE_CONFIG_MAPS

          mka vendorbootimage -j2

          test -s out/target/product/km5n/vendor_boot.img
          stat -c '%n %s bytes' out/target/product/km5n/vendor_boot.img
          bash device/tecno/km5n/scripts/validate_vendor_boot.sh out/target/product/km5n/vendor_boot.img
          bash device/tecno/km5n/scripts/audit_twrp_output.sh out/target/product/km5n

      - name: Collect build logs on failure
        if: failure()
        run: |
          set +e
          export TWRP_DIR="$GITHUB_WORKSPACE/twrp371"
          cd "$TWRP_DIR" 2>/dev/null || exit 0
          mkdir -p build-debug
          cp -f repo-sync.log build-debug/ 2>/dev/null || true
          cp -f .repo/manifest.xml build-debug/manifest.xml 2>/dev/null || true
          cp -f .repo/local_manifests/remove-minimal.xml build-debug/ 2>/dev/null || true
          cp -f out/soong/build.ninja build-debug/ 2>/dev/null || true
          cp -f out/verbose.log.gz build-debug/ 2>/dev/null || true
          cp -f out/soong/release-config.out build-debug/ 2>/dev/null || true
          find out/soong/release-config -maxdepth 2 -type f -print -exec sh -c 'echo "--- $1"; sed -n "1,160p" "$1"' _ {} \; > build-debug/release-config.txt 2>/dev/null || true
          df -h "$GITHUB_WORKSPACE" > build-debug/disk.txt 2>&1 || true
          du -sh "$TWRP_DIR"/* 2>/dev/null | sort -h > build-debug/top-level-disk.txt || true

      - name: Upload build output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twrp-km5n-371-build-output
          path: |
            ${{ github.workspace }}/twrp371/out/target/product/km5n/vendor_boot.img
            ${{ github.workspace }}/twrp371/build-debug/**
          if-no-files-found: warn
