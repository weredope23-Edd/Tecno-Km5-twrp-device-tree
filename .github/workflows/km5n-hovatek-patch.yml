name: KM5n - Build minimal Hovatek touch patch

on:
  push:
    paths:
      - ".github/workflows/km5n-hovatek-patch.yml"
      - "device/tecno/km5n/recovery/root/lib/modules/**"
      - "stock/vendor_a.img"
      - "stock/vendor_dlkm.img"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Install EROFS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y erofs-utils

      - name: Build minimal touch-only patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf patch vendor_extract vendor_dlkm_extract
          mkdir -p             patch/lib/modules             patch/vendor/lib/modules             patch/vendor_dlkm/lib/modules             patch/vendor/firmware             vendor_extract             vendor_dlkm_extract

          # Exact KM5n touch modules. Hovatek's documented
          # boot.img + vendor_boot.img method requires each named
          # touch driver in all three module locations.
          for f in             adaptive-ts.ko             novatek_nt36xxx.ko             nt36528a_hdp_dsi_vdo_hx_hxt9_120hz_km5.ko; do
            src="device/tecno/km5n/recovery/root/lib/modules/$f"
            test -s "$src"
            cp -a "$src" patch/lib/modules/
            cp -a "$src" patch/vendor/lib/modules/
            cp -a "$src" patch/vendor_dlkm/lib/modules/
          done

          # Exact stock Novatek firmware. These are the only non-module
          # files retained because the Novatek driver loads its firmware.
          fsck.erofs --extract=vendor_extract stock/vendor_a.img

          for f in novatek_ts_fw_02.bin novatek_mp.bin; do
            src="$(find vendor_extract -type f -name "$f" -print -quit || true)"
            test -n "$src"
            test -s "$src"
            cp -a "$src" patch/vendor/firmware/
          done

          # Verify this patch contains nothing except the 11 required files.
          count="$(find patch -type f | wc -l)"
          test "$count" -eq 11

          echo "===== MINIMAL TOUCH PATCH ====="
          find patch -type f -printf '%P %s bytes\n' | sort

          (
            cd patch
            zip -9 -r ../KM5n-Hovatek-patch-minimal.zip .
          )

          sha256sum KM5n-Hovatek-patch-minimal.zip
          unzip -l KM5n-Hovatek-patch-minimal.zip

      - name: Upload minimal touch patch
        uses: actions/upload-artifact@v4
        with:
          name: KM5n-Hovatek-patch-minimal
          path: KM5n-Hovatek-patch-minimal.zip
          if-no-files-found: error
