name: KM5n Vendor DFE Inspector

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/km5n-dfe-vendor-inspect.yml'
      - 'stock/vendor_a.img'

jobs:
  inspect:
    name: Inspect and build stock vendor_a.img DFE candidate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - name: Verify stock vendor image
        run: |
          set -euo pipefail
          test -f stock/vendor_a.img
          sha256sum stock/vendor_a.img | tee vendor_a.sha256
          test "$(sha256sum stock/vendor_a.img | awk '{print $1}')" = "b2d47a2d341f651ec4ad175273f07d987f2c068b94d46878bba589642793ef38"
          stat -c 'vendor_a.img: %s bytes' stock/vendor_a.img | tee vendor_size.txt
      - name: Install EROFS build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y autoconf automake autopoint libtool pkg-config uuid-dev zlib1g-dev liblz4-dev liblzma-dev libzstd-dev libfuse-dev git build-essential python3 python3-pip
      - name: Build modern liblzma
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v5.4.6 https://github.com/tukaani-project/xz.git /tmp/xz
          cd /tmp/xz
          ./autogen.sh --no-po4a --no-doxygen
          ./configure --prefix=/usr/local --disable-doxygen
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          pkg-config --modversion liblzma
      - name: Build EROFS v1.9.3
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CPPFLAGS="-I/usr/local/include ${CPPFLAGS:-}"
          export LDFLAGS="-L/usr/local/lib -Wl,-rpath,/usr/local/lib ${LDFLAGS:-}"
          git clone --depth 1 --branch v1.9.3 https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git /tmp/erofs-utils
          cd /tmp/erofs-utils
          ./autogen.sh
          ./configure --enable-lz4 --enable-lzma --with-libzstd
          make -j"$(nproc)"
          sudo install -m 0755 fsck/fsck.erofs /usr/local/bin/fsck.erofs
          sudo install -m 0755 dump/dump.erofs /usr/local/bin/dump.erofs
          sudo install -m 0755 mkfs/mkfs.erofs /usr/local/bin/mkfs.erofs
          fsck.erofs -V
          dump.erofs -V
          mkfs.erofs --help | tee mkfs_erofs_help.txt
      - name: Inspect stock EROFS
        run: |
          set -euo pipefail
          dump.erofs -s stock/vendor_a.img | tee vendor_dump_summary.txt
          dump.erofs -S stock/vendor_a.img | tee vendor_dump_superblock.txt
          fsck.erofs stock/vendor_a.img | tee vendor_fsck.txt
      - name: Extract vendor filesystem
        run: |
          set -euo pipefail
          rm -rf extracted_vendor modified_vendor
          mkdir -p extracted_vendor modified_vendor
          fsck.erofs --extract=extracted_vendor stock/vendor_a.img
          test -f extracted_vendor/etc/fstab.mt6768
          cp -a extracted_vendor/. modified_vendor/
          cp extracted_vendor/etc/fstab.mt6768 stock_fstab.mt6768
          cat stock_fstab.mt6768
      - name: Apply DFE fstab change
        run: |
          set -euo pipefail
          data_line="$(grep -E '(^|[[:space:]])/data([[:space:]]|$)' stock_fstab.mt6768 | head -n1 || true)"
          test -n "$data_line"
          printf '%s\n' "$data_line" | tee stock_data_fstab_line.txt
          grep -q 'inlinecrypt' stock_fstab.mt6768
          grep -q 'fileencryption=aes-256-xts:aes-256-cts:v2' stock_fstab.mt6768
          grep -q 'keydirectory=/metadata/vold/metadata_encryption' stock_fstab.mt6768
          grep -q '/metadata' stock_fstab.mt6768
          python3 - <<'PY'
          from pathlib import Path
          p=Path('modified_vendor/etc/fstab.mt6768')
          s=p.read_text(); old=s
          for t in [',inlinecrypt',',fileencryption=aes-256-xts:aes-256-cts:v2',',keydirectory=/metadata/vold/metadata_encryption','fileencryption=aes-256-xts:aes-256-cts:v2,','keydirectory=/metadata/vold/metadata_encryption,']:
              s=s.replace(t,'')
          out=[]
          for line in s.splitlines():
              if '/data' in line.split() and 'encryptable=/dev/block/by-name/metadata' not in line:
                  parts=line.split()
                  if len(parts)>=4:
                      parts[3]+=',encryptable=/dev/block/by-name/metadata'
                      line=' '.join(parts)
              out.append(line)
          s='\n'.join(out)+('\n' if s.endswith('\n') else '')
          if s==old: raise SystemExit('DFE edit made no changes')
          p.write_text(s)
          PY
          cat modified_vendor/etc/fstab.mt6768
          grep -q 'encryptable=/dev/block/by-name/metadata' modified_vendor/etc/fstab.mt6768
          ! grep -q 'inlinecrypt' modified_vendor/etc/fstab.mt6768
          ! grep -q 'fileencryption=aes-256-xts:aes-256-cts:v2' modified_vendor/etc/fstab.mt6768
          ! grep -q 'keydirectory=/metadata/vold/metadata_encryption' modified_vendor/etc/fstab.mt6768
          diff -u stock_fstab.mt6768 modified_vendor/etc/fstab.mt6768 | tee fstab_dfe.patch || true
      - name: Derive safe EROFS rebuild hints
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('vendor_dump_summary.txt').read_text(errors='replace')
          def field(names, default=''):
              for n in names:
                  m=re.search(r'^\s*'+re.escape(n)+r'\s*:\s*(.*?)\s*$',s,re.I|re.M)
                  if m:return m.group(1).strip()
              return default
          uuid=field(['Filesystem UUID','UUID'])
          block_raw=field(['Block size','Filesystem block size'],'4096')
          m=re.search(r'\d+',block_raw); block=m.group(0) if m else '4096'
          if block not in ('4096','8192','16384','32768','65536'): block='4096'
          alg=field(['Filesystem compr_algs','Filesystem compression algorithms','Compression algorithms'])
          low=alg.lower()
          if 'lz4hc' in low: alg='lz4hc'
          elif re.search(r'\blz4\b',low): alg='lz4'
          elif 'lzma' in low: alg='lzma'
          elif 'zstd' in low: alg='zstd'
          elif 'deflate' in low: alg='deflate'
          else:
              alg=''
              for a in ('lz4hc','lz4','lzma','zstd','deflate'):
                  if re.search(r'\b'+a+r'\b',s,re.I): alg=a; break
          norm=s.lower().replace('-','_')
          feats=[]
          for f in ('ztailpacking','fragments','dedupe'):
              if re.search(r'\b'+f+r'\b',norm): feats.append(f)
          big=bool(re.search(r'\bbig[_ -]?pcluster\b',norm))
          Path('erofs_rebuild_hints.txt').write_text('\n'.join([f'UUID={uuid}',f'BLOCK_SIZE={block}',f'COMPR_ALG={alg}',f'BIG_PCLUSTER={int(big)}',f'FEATURES={" ".join(feats)}'])+'\n')
          print(Path('erofs_rebuild_hints.txt').read_text(),end='')
          PY
      - name: Build validated DFE EROFS candidate
        id: build_candidate
        continue-on-error: true
        run: |
          set -u
          source erofs_rebuild_hints.txt
          orig_size=$(stat -c '%s' stock/vendor_a.img)
          : > rebuild_attempts.txt
          best=''; best_size=0
          feature_sets=()
          stock_features=''
          [[ " ${FEATURES:-} " =~ [[:space:]]ztailpacking[[:space:]] ]] && stock_features+='ztailpacking,'
          [[ " ${FEATURES:-} " =~ [[:space:]]fragments[[:space:]] ]] && stock_features+='fragments,'
          [[ " ${FEATURES:-} " =~ [[:space:]]dedupe[[:space:]] ]] && stock_features+='dedupe,'
          stock_features="${stock_features%,}"
          [[ -n "$stock_features" ]] && feature_sets+=("$stock_features")
          feature_sets+=("")
          clusters=(4096)
          if [[ "${BIG_PCLUSTER:-0}" == 1 ]]; then clusters=(65536 131072 262144 524288 1048576 4096); fi
          comps=()
          case "${COMPR_ALG:-}" in
            lz4hc) comps=('lz4hc,12' 'lz4hc,9' 'lz4,9' 'lz4') ;;
            lz4) comps=('lz4,9' 'lz4' 'lz4hc,12' 'lz4hc,9') ;;
            lzma) comps=('lzma,9' 'lzma,6' 'lz4hc,12' 'lz4hc,9') ;;
            zstd) comps=('zstd,19' 'zstd,15' 'lz4hc,12' 'lz4hc,9') ;;
            deflate) comps=('deflate,9' 'deflate,6' 'lz4hc,12' 'lz4hc,9') ;;
            *) comps=('lz4hc,12' 'lz4hc,9' 'lz4,9' 'lz4' 'lzma,6' 'zstd,19') ;;
          esac
          comps+=("")
          for feats in "${feature_sets[@]}"; do
            for cluster in "${clusters[@]}"; do
              for comp in "${comps[@]}"; do
                label="${comp:-uncompressed}"
                out="candidate-${label//,/-}-${cluster}.img"
                echo "=== features=${feats:-none} compression=$label cluster=$cluster ===" | tee -a rebuild_attempts.txt
                rm -f "$out" "$out.fsck"
                args=(-b "${BLOCK_SIZE:-4096}")
                [[ -n "${UUID:-}" ]] && args+=(-U "$UUID")
                [[ -n "$comp" ]] && args+=(-z "$comp" -C "$cluster")
                [[ -n "$feats" ]] && args+=(-E "$feats")
                if mkfs.erofs "${args[@]}" "$out" modified_vendor >>rebuild_attempts.txt 2>&1; then
                  size=$(stat -c '%s' "$out")
                  echo "built $out: $size bytes" | tee -a rebuild_attempts.txt
                  if [[ "$size" -le "$orig_size" ]] && fsck.erofs "$out" >"$out.fsck" 2>&1; then
                    best="$out"; best_size="$size"
                    echo "VALID CANDIDATE: $out" | tee -a rebuild_attempts.txt
                    break 3
                  fi
                  echo "rejected: size or fsck" | tee -a rebuild_attempts.txt
                  tail -n 30 "$out.fsck" 2>/dev/null | tee -a rebuild_attempts.txt || true
                else
                  echo "mkfs failed: $out" | tee -a rebuild_attempts.txt
                  tail -n 20 rebuild_attempts.txt
                fi
                rm -f "$out" "$out.fsck"
              done
            done
          done
          if [[ -z "$best" ]]; then
            echo 'NO VALID CANDIDATE WAS BUILT' | tee -a rebuild_attempts.txt
            exit 1
          fi
          cp "$best" vendor_a_dfe_candidate.img
          sha256sum vendor_a_dfe_candidate.img | tee vendor_a_dfe_candidate.sha256
          printf 'candidate_size=%s\noriginal_size=%s\n' "$best_size" "$orig_size" | tee candidate_size.txt
          dump.erofs -s vendor_a_dfe_candidate.img | tee candidate_dump_summary.txt
          dump.erofs -S vendor_a_dfe_candidate.img | tee candidate_dump_superblock.txt
          fsck.erofs vendor_a_dfe_candidate.img | tee candidate_fsck.txt
      - name: Package diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: km5n-vendor-dfe-diagnostics
          if-no-files-found: warn
          path: |
            vendor_a.sha256
            vendor_size.txt
            vendor_dump_summary.txt
            vendor_dump_superblock.txt
            vendor_fsck.txt
            stock_fstab.mt6768
            modified_vendor/etc/fstab.mt6768
            stock_data_fstab_line.txt
            fstab_dfe.patch
            erofs_rebuild_hints.txt
            rebuild_attempts.txt
            mkfs_erofs_help.txt
            candidate_size.txt
            vendor_a_dfe_candidate.img
            vendor_a_dfe_candidate.sha256
            candidate_dump_summary.txt
            candidate_dump_superblock.txt
            candidate_fsck.txt
      - name: Inspect AVB footer
        if: steps.build_candidate.outcome == 'success'
        run: |
          set -euo pipefail
          git clone --depth 1 https://android.googlesource.com/platform/external/avb /tmp/avb
          python3 /tmp/avb/avbtool.py info_image --image stock/vendor_a.img | tee vendor_a_avb.txt
          python3 /tmp/avb/avbtool.py info_image --image vendor_a_dfe_candidate.img | tee vendor_a_dfe_candidate_avb.txt || true
      - name: Upload successful candidate
        if: steps.build_candidate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: km5n-vendor-dfe-candidate
          path: |
            vendor_a_dfe_candidate.img
            vendor_a_dfe_candidate.sha256
            candidate_size.txt
            candidate_dump_summary.txt
            candidate_dump_superblock.txt
            candidate_fsck.txt
            vendor_a_avb.txt
            vendor_a_dfe_candidate_avb.txt
            stock_fstab.mt6768
            fstab_dfe.patch
            erofs_rebuild_hints.txt
      - name: Fail if no validated candidate exists
        if: steps.build_candidate.outcome != 'success'
        run: |
          echo 'DFE fstab edit succeeded, but no validated vendor_a EROFS candidate was produced.'
          exit 1
