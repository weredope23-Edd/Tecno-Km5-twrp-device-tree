name: KM5n Vendor DFE Inspector

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/km5n-dfe-vendor-inspect.yml'
      - 'stock/vendor_a.img'

jobs:
  inspect:
    name: Inspect and build stock vendor_a.img DFE candidate
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository with LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1

      - name: Verify stock vendor image
        shell: bash
        run: |
          set -euo pipefail
          test -f stock/vendor_a.img
          sha256sum stock/vendor_a.img | tee vendor_a.sha256
          test "$(sha256sum stock/vendor_a.img | awk '{print $1}')" = "b2d47a2d341f651ec4ad175273f07d987f2c068b94d46878bba589642793ef38"
          stat -c 'vendor_a.img: %s bytes' stock/vendor_a.img | tee vendor_size.txt

      - name: Install EROFS build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint libtool pkg-config uuid-dev zlib1g-dev \
            liblz4-dev liblzma-dev libzstd-dev libfuse-dev git build-essential \
            python3 python3-pip

      - name: Build a modern liblzma for EROFS MicroLZMA support
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v5.4.6 https://github.com/tukaani-project/xz.git /tmp/xz
          cd /tmp/xz
          ./autogen.sh --no-po4a --no-doxygen
          ./configure --prefix=/usr/local --disable-doxygen
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          pkg-config --modversion liblzma
          ldconfig -p | grep 'liblzma.so' | head

      - name: Build EROFS v1.9.1 with LZ4, ZSTD and MicroLZMA support
        shell: bash
        run: |
          set -euo pipefail
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/lib/x86_64-linux-gnu/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CPPFLAGS="-I/usr/local/include ${CPPFLAGS:-}"
          export LDFLAGS="-L/usr/local/lib -Wl,-rpath,/usr/local/lib ${LDFLAGS:-}"
          git clone --depth 1 --branch v1.9.1 https://git.kernel.org/pub/scm/linux/kernel/git/xiang/erofs-utils.git /tmp/erofs-utils
          cd /tmp/erofs-utils
          ./autogen.sh
          ./configure --enable-lz4 --enable-lzma --with-libzstd
          make -j"$(nproc)"
          sudo install -m 0755 fsck/fsck.erofs /usr/local/bin/fsck.erofs
          sudo install -m 0755 dump/dump.erofs /usr/local/bin/dump.erofs
          sudo install -m 0755 mkfs/mkfs.erofs /usr/local/bin/mkfs.erofs
          /usr/local/bin/fsck.erofs -V
          /usr/local/bin/dump.erofs -V || true
          /usr/local/bin/mkfs.erofs --help | tee mkfs_erofs_help.txt

      - name: Inspect EROFS metadata and integrity
        shell: bash
        run: |
          set -euo pipefail
          echo '--- EROFS superblock ---'
          dump.erofs -s stock/vendor_a.img | tee vendor_dump_summary.txt
          echo '--- EROFS statistics ---'
          dump.erofs -S stock/vendor_a.img | tee vendor_dump_superblock.txt
          echo '--- EROFS integrity check ---'
          fsck.erofs stock/vendor_a.img | tee vendor_fsck.txt

      - name: Extract vendor filesystem
        shell: bash
        run: |
          set -euo pipefail
          rm -rf extracted_vendor modified_vendor
          mkdir -p extracted_vendor modified_vendor
          fsck.erofs --extract=extracted_vendor stock/vendor_a.img
          test -f extracted_vendor/etc/fstab.mt6768
          cp -a extracted_vendor/. modified_vendor/
          cp extracted_vendor/etc/fstab.mt6768 stock_fstab.mt6768
          echo '--- stock vendor/etc/fstab.mt6768 ---'
          cat stock_fstab.mt6768

      - name: Audit and apply Hovatek-style DFE fstab change
        shell: bash
        run: |
          set -euo pipefail
          data_line="$(grep -E '(^|[[:space:]])/data([[:space:]]|$)' stock_fstab.mt6768 | head -n1 || true)"
          test -n "$data_line"
          printf '%s\n' "$data_line" | tee stock_data_fstab_line.txt
          grep -q 'inlinecrypt' stock_fstab.mt6768
          grep -q 'fileencryption=aes-256-xts:aes-256-cts:v2' stock_fstab.mt6768
          grep -q 'keydirectory=/metadata/vold/metadata_encryption' stock_fstab.mt6768
          grep -q '/metadata' stock_fstab.mt6768

          python3 - <<'PY'
          from pathlib import Path
          p = Path('modified_vendor/etc/fstab.mt6768')
          s = p.read_text()
          old = s
          s = s.replace(',inlinecrypt', '')
          s = s.replace(',fileencryption=aes-256-xts:aes-256-cts:v2', '')
          s = s.replace(',keydirectory=/metadata/vold/metadata_encryption', '')
          s = s.replace('fileencryption=aes-256-xts:aes-256-cts:v2,', '')
          s = s.replace('keydirectory=/metadata/vold/metadata_encryption,', '')
          lines = []
          for line in s.splitlines():
              if '/data' in line.split():
                  if 'encryptable=/dev/block/by-name/metadata' not in line:
                      parts = line.split()
                      if len(parts) >= 4:
                          opts = parts[3].split(',')
                          opts.append('encryptable=/dev/block/by-name/metadata')
                          parts[3] = ','.join(opts)
                          line = ' '.join(parts)
              lines.append(line)
          s = '\n'.join(lines) + ('\n' if s.endswith('\n') else '')
          if s == old:
              raise SystemExit('DFE edit made no changes')
          p.write_text(s)
          PY

          echo '--- modified vendor/etc/fstab.mt6768 ---'
          cat modified_vendor/etc/fstab.mt6768
          grep -q 'encryptable=/dev/block/by-name/metadata' modified_vendor/etc/fstab.mt6768
          ! grep -q 'inlinecrypt' modified_vendor/etc/fstab.mt6768
          ! grep -q 'fileencryption=aes-256-xts:aes-256-cts:v2' modified_vendor/etc/fstab.mt6768
          ! grep -q 'keydirectory=/metadata/vold/metadata_encryption' modified_vendor/etc/fstab.mt6768
          diff -u stock_fstab.mt6768 modified_vendor/etc/fstab.mt6768 | tee fstab_dfe.patch

      - name: Derive original EROFS UUID, block size and compression hints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          s = Path('vendor_dump_summary.txt').read_text(errors='replace')
          uuid = re.search(r'(?i)\bUUID\s*[:=]\s*([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b', s)
          block = re.search(r'(?i)(?:block\s*size|blksz|blocksize)\s*[:=]\s*(\d+)', s)
          comps = []
          for x in ('lz4hc','lz4','lzma','zstd','deflate'):
              if re.search(r'(?i)\b' + re.escape(x) + r'\b', s):
                  comps.append(x)
          out = []
          out.append('UUID=' + (uuid.group(1) if uuid else ''))
          out.append('BLOCK_SIZE=' + (block.group(1) if block else '4096'))
          out.append('COMPRESSION=' + (comps[0] if comps else 'lz4hc'))
          Path('erofs_rebuild_hints.txt').write_text('\n'.join(out) + '\n')
          print('\n'.join(out))
          PY
          cat erofs_rebuild_hints.txt

      - name: Build validated standalone DFE EROFS candidate
        shell: bash
        run: |
          set -euo pipefail
          source erofs_rebuild_hints.txt
          orig_size="$(stat -c '%s' stock/vendor_a.img)"
          uuid_arg=()
          if [[ "${UUID:-}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            uuid_arg=(-U "$UUID")
          fi
          # Android vendor EROFS commonly uses 4 KiB blocks with larger physical
          # clusters. Try several compatible cluster sizes rather than forcing the
          # block size itself, which can make the rebuilt image unnecessarily large.
          if [ "${BLOCK_SIZE:-4096}" = "4096" ]; then
            clusters=(65536 32768 16384 4096)
          else
            clusters=(65536 32768 16384 "$BLOCK_SIZE")
          fi
          candidates=(
            'lz4hc,12'
            'lz4hc,9'
            'lz4'
            'lzma,6'
            'lzma,9'
            ''
          )
          best=''
          best_size=0
          : > rebuild_attempts.txt
          for cluster in "${clusters[@]}"; do
            for comp in "${candidates[@]}"; do
              label="${comp:-uncompressed}"
              safe="${label//,/-}-${cluster}"
              out="candidate-${safe}.img"
              echo "=== Trying compression=${label}, pcluster=${cluster} ===" | tee -a rebuild_attempts.txt
              rm -f "$out" "${out}.fsck"
              args=(-b "$BLOCK_SIZE" "${uuid_arg[@]}")
              if [ -n "$comp" ]; then
                args+=(-z "$comp" -C "$cluster")
              fi
              if mkfs.erofs "${args[@]}" "$out" modified_vendor >> rebuild_attempts.txt 2>&1; then
                size="$(stat -c '%s' "$out")"
                echo "$out: $size bytes" | tee -a rebuild_attempts.txt
                if [ "$size" -le "$orig_size" ] && fsck.erofs "$out" > "${out}.fsck" 2>&1; then
                  best="$out"
                  best_size="$size"
                  echo "VALID CANDIDATE: $out" | tee -a rebuild_attempts.txt
                  break 2
                fi
                echo "Rejected: too large or fsck failed" | tee -a rebuild_attempts.txt
              else
                echo "mkfs.erofs failed for $label at pcluster $cluster" | tee -a rebuild_attempts.txt
              fi
              rm -f "$out" "${out}.fsck"
            done
          done
          test -n "$best"
          cp "$best" vendor_a_dfe_candidate.img
          sha256sum vendor_a_dfe_candidate.img | tee vendor_a_dfe_candidate.sha256
          printf 'candidate_size=%s\noriginal_size=%s\n' "$best_size" "$orig_size" | tee candidate_size.txt
          dump.erofs -s vendor_a_dfe_candidate.img | tee candidate_dump_summary.txt
          dump.erofs -S vendor_a_dfe_candidate.img | tee candidate_dump_superblock.txt
          fsck.erofs vendor_a_dfe_candidate.img | tee candidate_fsck.txt

      - name: Inspect vendor_a AVB footer
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://android.googlesource.com/platform/external/avb /tmp/avb
          python3 /tmp/avb/avbtool.py info_image --image stock/vendor_a.img | tee vendor_a_avb.txt
          python3 /tmp/avb/avbtool.py info_image --image vendor_a_dfe_candidate.img | tee vendor_a_dfe_candidate_avb.txt || true

      - name: Package DFE candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: km5n-vendor-dfe-candidate
          path: |
            vendor_a.sha256
            vendor_size.txt
            vendor_dump_summary.txt
            vendor_dump_superblock.txt
            vendor_fsck.txt
            stock_fstab.mt6768
            modified_vendor/etc/fstab.mt6768
            stock_data_fstab_line.txt
            fstab_dfe.patch
            erofs_rebuild_hints.txt
            rebuild_attempts.txt
            candidate_size.txt
            vendor_a_dfe_candidate.img
            vendor_a_dfe_candidate.sha256
            candidate_dump_summary.txt
            candidate_dump_superblock.txt
            candidate_fsck.txt
            vendor_a_avb.txt
            vendor_a_dfe_candidate_avb.txt
          if-no-files-found: error
